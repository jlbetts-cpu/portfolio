    <meta charset="UTF-8" />

    <link rel="manifest" href="/workspace/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/workspace/apple-touch-icon.png" />

    <title>Jayden Betts</title>
    <style>
      /* SELF-HOSTED, LIKE EVERY OTHER PAGE ON THIS SITE. This page was the only
         one making third-party font requests -- two preconnects and a
         render-blocking stylesheet from Google -- which delays first text and
         sends a visitor's IP and referrer to Google before anything is drawn.
         Molle was in that request and is used NOWHERE in this page's CSS: zero
         hits. It is simply not fetched now.
         Geist is the variable file the rest of the site already ships, so it
         costs nothing extra here; Geist Mono is used by this page and was the
         only family that had to be added.

         THE PATHS ARE SITE-ROOT ON PURPOSE. The fonts live at /fonts/ in the
         portfolio, one level above /workspace/. They must NOT pick up the Vite
         base, which is why they are written absolute and why the build is
         checked for exactly this after every change. */
      @font-face{font-family:"Geist";src:url("/fonts/geist-variable.woff2") format("woff2-variations");
        font-weight:100 900;font-style:normal;font-display:swap}
      @font-face{font-family:"Geist Mono";src:url("/fonts/geist-mono-latin-variable.woff2") format("woff2-variations");
        font-weight:100 900;font-style:normal;font-display:swap}
      /* MOLLE IS THE WORKSPACE'S LOGO AND I ALMOST DROPPED IT. Grepping this
         page's CSS for "Molle" returns zero, so the first pass removed it as
         unused -- but the logo is rendered from JS, `fontFamily:"Molle",
         cursive` with an inline style, which no CSS grep can see. Jayden caught
         it in one sentence. It is italic-only; there is no upright face. */
      @font-face{font-family:"Molle";src:url("/fonts/molle-latin-italic.woff2") format("woff2");
        font-weight:400;font-style:italic;font-display:swap}
    </style>
    <script type="module" crossorigin src="/workspace/assets/index-idkfbMwX.js"></script>
    <link rel="stylesheet" crossorigin href="/workspace/assets/index--zuSg_aZ.css">
  </head>

  </body>
