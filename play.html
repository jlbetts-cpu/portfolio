<!doctype html><html lang="en" class="jbShrunk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play — Jayden Betts</title>
<meta name="robots" content="noindex">
<!-- The two text faces, ahead of the stylesheet that declares them: a preload must be in the
     document head, and these are the only fonts a visible word on this page ever uses. Same
     three attributes index.html uses (as=font, type, crossorigin -- fonts are always fetched
     in CORS mode, so without crossorigin the preload is fetched twice and used once).
     Archivo is not preloaded, matching index.html: it is 90 KB and only the scoreboard
     numerals use it, which do not exist until a match is running. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/instrument-sans-latin-400-normal.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/instrument-sans-latin-600-normal.woff2" crossorigin>
<!-- THE SHARED DESIGN TOKENS. Linked ahead of play.css so play.css's own :root can still
     override the two tokens this page legitimately binds differently (--accent is the
     live-match green here, not the site's interactive blue). Before this, play.css carried
     a hand-copied subset of the token block plus a second flagged "top-up" block at its
     foot; both are gone -- tokens.css is the one source now. See
     .superpowers/sdd/2026-08-02-play-page/play-tokens-report.md §1. -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="play.css">
<style>
 /* The arena carries class="hero" deliberately: the engine measures ".hero" in
    16 places. Renaming those is a later pass; see spec 5.1. */
 /* PAPER, like every other page. The dark lobby is gone: Jayden asked for it, saw it, and
    reversed it -- "shouldn't be dark mode. Should be minimal with a NASA planet and the heads
    jumping on it." That deleted a whole colour system from this file rather than adding one,
    and it took the ink chrome, the terminator and the sky grain with it. */
 html,body{margin:0;height:100%;background:var(--c50);overflow:hidden}
 /* play.css:58 also declares body{background:var(--c50)}; this block is a later
    same-specificity rule, so it wins by source order -- the same mechanism the note
    below already documents for the paper value it replaces. */
 /* Was background:var(--paper,#f7f6f3) -- --paper isn't a token this site defines, so it
    silently fell through to the hard-coded fallback hex, a shade off index.html's real body
    background (--c50, #FDFDFD; the fallback was #f7f6f3, a visibly warmer/grayer off-white).
    play.css already carries the correct body{background:var(--c50)} base rule (copied from
    index.html:58), but this inline block is a later same-specificity rule (a plain `body`
    selector either way), so it won the cascade by source order and silently shadowed it. */
 /* COMPOSITION (fix round 2): the engine derives its entire floor plane from
    hero.clientHeight (FLOORCAP, play-engine.js survey()) and every game element --
    ball, goals, heads, and the scoreboard itself (a .hero child; .hmScore's
    top:40px is relative to the band, not the viewport) -- is a flat .hero
    descendant. So a shorter, vertically-centred .hero pulls the whole scene up
    into a broadcast-style band with the scoreboard sitting just above it, with NO
    play-engine.js change: this is CSS-only. body becomes the centring flex
    container; .hero, as body's one in-flow child (the back link and the game menu
    are both position:fixed, out of flow), gets margin:auto to centre on both axes --
    though only the vertical axis has free space to give, since .hero still spans
    the full 100vw. See task-2-report.md's fix-round-2 addendum for the measured
    before/after and the mobile decision (play.css:146). */
 body{display:flex}
 .hero{position:relative;width:100vw;height:60vh;margin:auto}
 /* The head host: real geometry (the clone copies it), zero ink (nobody is meant to see it).
    Sized off the viewport height so it never fights the arena band, and pinned dead centre so
    updateIris() derives the same cursor-relative gaze it does on the home page. */
 .heroHeadHost{position:fixed;left:50%;top:50%;width:min(420px,46vw);transform:translate(-50%,-50%);opacity:0;pointer-events:none;z-index:0}
 .heroHeadHost .stagewrap{position:relative;width:100%}
 /* Task 3: #moodMenu's own base rule (play.css:152) sets neither left nor right, so its
    static position defaults to moodBtn's LEFT edge and grows rightward by its own width.
    Home used to get away with that because of a JS module (clampMenuX) that measured at
    open-time and flipped to right:0 when the menu "would leave the column"; it was never
    ported here, and as of the mobile audit it is deleted there too -- the v2 header outgrew
    it and home now does the same static thing this rule does (header.css:414). play.html's menu bar is pinned to the
    right edge (right:16px, below), so left-aligned growth runs the menu off the viewport's
    right edge every time -- measured 70px of overflow at 1280px wide, worse on anything
    narrower, and body's overflow:hidden (line 9) makes the overflow unreachable, not just
    ugly. Anchoring the menu to the SAME edge as the button it drops from is also just the
    correct static answer for a corner-pinned bar, not a workaround. */
 #moodMenu{left:auto;right:0}

 /* ==========================================================================
    THE PLAY HUB. Everything below is new for the games-menu pass and lives in
    THIS file on purpose, not in play.css: play.css belongs to a concurrent
    agent this pass, and a page-scoped block here is the only place these rules
    could land without two agents writing one file. They are token-only and
    self-contained, so lifting the whole block into play.css later is a cut and
    a paste. See .superpowers/sdd/2026-08-02-play-page/play-hub-report.md.
    Design: docs/superpowers/specs/2026-08-02-play-hub-research.md.
    ========================================================================== */

 /* ---- THE NASA PLANET: THE ASSET IS BUILT AND SHIPPED, THE RENDER IS BLOCKED ON ONE
    ENGINE CHANGE. Both halves of that sentence matter, so here is the arithmetic rather
    than an apology.

    BUILT: images/earth-disc.webp -- 1024x1024, 102,510 bytes (100 KB), from the committed
    images/earth-disc-src.jpg (2048x2048, 593 KB) via `sips -Z 1024` +
    `cwebp -q 72 -m 6 -sharp_yuv`. The 2.51 MB equirectangular master is never served. NASA
    Blue Marble, public domain.

    BLOCKED: the lobby-planet spec (planet report §5.1-5.2) places heads BY ANGLE around the
    disc, which is play-engine.js's job. This engine puts every head on ONE FLAT feet line --
    the shared ground rule the whole build rests on. Those two facts are not compatible at
    any radius, and the gap is not marginal. Using the spec's own sag formula
    R - sqrt(R^2 - d^2), measured at 1280 wide against a 1024px source:

        R        sag at the screen edge      upscale needed to stay legible
        0.65vw   300px                       1.6x   <- the spec's radius, limb on screen
        1.0vw    171px                       2.5x
        1.6vw    103px                       4.0x
        3.2vw     50px                       8.0x
        6.0vw     27px                      15.0x

    A head is 108px tall. Anything above ~10px of sag has the outermost heads visibly
    hanging in the air, so a flat feet line needs R >= 6vw; Earth stays legible only up to
    about R = 1vw. Six times apart -- there is no radius that satisfies both, which is why
    this is a blocker and not a tuning problem.
    The unblock is one change in play-engine.js: place lobby heads by angle
    (x = cx + R sin0, y = cy - R cos0, rotation = 0) reusing each head's own FOOT
    transform-origin, exactly as report §5.3 describes. The asset, the radius and the halo
    treatment are all decided and waiting on it -- see the report.

    THE HALO, decided so it does not get re-litigated: `screen`, not Gradient Lab's
    `multiply`. The Lab's own background-mode work found multiply collapses on a dark
    ground; on this paper ground it would not collapse, it would DARKEN the paper around the
    planet -- which is a cast shadow, and chrome here never casts. An atmosphere is light
    leaving the planet, so the blend can only ever add. ---- */
 :root{--head-edge:var(--c50)}

 /* ---- THE HUB. Two blocks pinned to the two ends of the viewport with the
    stage running between them, which is what makes this fit without scrolling:
    the heads live in a band roughly 62vh-75vh, the title block ends near 24vh
    and the cards begin near 80vh, so nothing overlaps and nothing had to move.
    pointer-events are OFF on the frame and on the title block -- the heads are
    draggable and a full-viewport overlay would eat every grab. ---- */
 .pHub{position:fixed;inset:0;z-index:40;pointer-events:none;
  display:flex;flex-direction:column;justify-content:flex-end;
  /* --sp-48 off --nav-h, not --sp-40. Measured at 390: .jbStick is 72px tall (a 52px nav
     plus its own padding-block), so a 92px top inset left the h1 FOUR pixels under the bar --
     which is most of what "crammed up there" was. 100px gives 28px of real air. */
  padding:calc(var(--nav-h) + var(--sp-40) + var(--sp-8)) var(--play-gutter) var(--sp-24-32);
  opacity:0;visibility:hidden;
  transition:opacity var(--sp-settle-dur) var(--sp-settle),visibility 0s linear var(--sp-settle-dur)}
 body.pHubOn .pHub{opacity:1;visibility:visible;transition-delay:0s,0s}
 @media(prefers-reduced-motion:reduce){.pHub{transition:none}}

 /* ---- THE CORNER MENU IS OFF, and the element stays. #moodbar/#moodBtn/#moodMenu are kept
    in the DOM because the tournament disables and restores #moodBtn BY ID
    (play-tournament.js:1163,1183) and play-games.js binds every launcher through them -- the
    hub's cards fire the same handlers. What is gone is the second visible surface. ---- */
 #moodbar{display:none}

 /* ---- THE FOUR DOORS. The page's only chrome now: the planet, the heads on it, and these.
    Paper, like the rest of the site -- --c0 on a --c50 ground with a rim, the same "separates
    upward" argument header.css makes for the nav bar. ---- */
 .pCards{pointer-events:auto;width:100%;max-width:var(--page-max);margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-12)}
 .pCard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-6);
  min-height:var(--tap-min);padding:var(--sp-14) var(--sp-16) var(--sp-16);
  border:0;border-radius:var(--r-md);background:var(--c0);box-shadow:var(--rim-1);
  font-family:var(--sans);color:var(--c950);text-align:left;text-decoration:none;cursor:pointer;
  /* one closed transition set, hover-OUT here and the shorter hover-IN on :hover -- the
     control system's rule, so these breathe at the same rate as the nav */
  transition-property:color,background-color,box-shadow,transform;
  transition-timing-function:var(--ease-out);transition-duration:var(--hover-out-dur)}
 /* HOVER MOVES INK AND WEIGHT, NEVER A FILL. This card used to light its whole box with a
    color-mix wash -- the last grey-fill hover on the site after the case studies and the nav
    had theirs stripped, and the main reason the hub read as "not as clean as the rest of the
    site". Now the description steps up in ink, the icon's stroke thickens with the label, and
    the rim goes --rim-1 -> --rim-2. A hairline is the permitted affordance for a target this
    large; a fill is not. */
 .pCard:hover{box-shadow:var(--rim-2);transition-duration:var(--ease-out-dur)}
 .pCard:hover .pCardD{color:var(--c700)}
 .pCard:hover .gIco{color:var(--c950);stroke-width:var(--ico-stroke-strong)}
 /* --press-scale-lg, not --press-scale: the ladder's rule is that boxes over ~200px take the
    gentler rung. Press is scale, never translateY. */
 .pCard:active{transform:scale(var(--press-scale-lg));transition-duration:var(--press-dur)}
 .pCard:focus-visible{outline:var(--focus-w) solid var(--c950);outline-offset:var(--sp-2)}
 .pCard:focus:not(:focus-visible){outline:none}
 .pCard[aria-disabled="true"]{opacity:.38;cursor:default;pointer-events:none}
 .pCard .gIco{width:var(--ico-md);height:var(--ico-md);flex:0 0 var(--ico-md);color:var(--c700);stroke-width:var(--ico-stroke)}
 .pCardT{font-weight:600;font-size:var(--fs-body);line-height:var(--lh-tight);letter-spacing:var(--tr-title)}
 .pCardD{font-weight:400;font-size:var(--fs-caption);line-height:var(--lh-body);letter-spacing:var(--tr-body);color:var(--c500)}


 /* ---- THE TEAM SCREEN. Not a modal over black: the whole reason the tray was
    promoted out of its 300px corner box is that this is the moment before a
    match, so the planet and the heads have to stay on screen and keep changing
    colour as you flip a chip (__hmTeamPreview, already wired). .hero shrinks
    and the heads rise; play-games.js dispatches a resize so the engine
    re-surveys the floor through its own tested path
    (play-engine.js:434). ---- */
 body.pTeamOn .hero{height:52vh;margin:6vh auto auto}
 .pTeam{position:fixed;left:0;right:0;bottom:0;z-index:45;pointer-events:none;
  padding:0 var(--play-gutter) var(--sp-24-32);
  opacity:0;visibility:hidden;transform:translateY(var(--sp-12));
  transition:opacity var(--sp-settle-dur) var(--sp-settle),transform var(--sp-settle-dur) var(--sp-settle),visibility 0s linear var(--sp-settle-dur)}
 body.pTeamOn .pTeam{opacity:1;visibility:visible;transform:none;transition-delay:0s,0s,0s}
 @media(prefers-reduced-motion:reduce){.pTeam{transition:none}}
 /* 920px, not --page-max: two columns holding at most four chips each have a natural
    width, and stretched to 1280 the sides read as two empty fields with a few stickers in
    them. The panel is as wide as its content wants to be and no wider. */
 .pTeamIn{pointer-events:auto;box-sizing:border-box;width:100%;max-width:920px;margin:0 auto;
  padding:var(--sp-16);border-radius:var(--r-lg);background:var(--c0);box-shadow:var(--rim-1)}
 .pTeamBar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-12);margin-bottom:var(--sp-12)}
 /* margin-right:auto rather than space-between doing the work: the bar is Back, then the
    title, then Shuffle pushed to the far end. Back and the title are one leading group --
    a title floated to the centre between two buttons reads as a dialog caption, and this
    is a screen. */
 .pTeamTitle{font-family:var(--sans);font-weight:600;font-size:var(--fs-h5);line-height:var(--lh-tight);letter-spacing:var(--tr-sub);color:var(--c950);margin:0 auto 0 0}
 .pBtnBack{padding-left:var(--sp-12)}
 .pTeamActs{display:flex;align-items:center;gap:var(--sp-8)}
 .pBtn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-8);
  min-height:var(--tap-min);padding:0 var(--sp-16);border:0;border-radius:var(--r-sm);
  background:var(--c0);box-shadow:var(--rim-2);color:var(--c950);
  font-family:var(--sans);font-weight:600;font-size:var(--fs-small);line-height:var(--lh-flat);cursor:pointer;
  transition:background-color var(--hover-out-dur) var(--ease-out),transform var(--ease-out-dur) var(--ease-out)}
 /* The rest-state fill stays (this is the secondary kind and it has a ground); what may not
    move on hover is that fill. Ink to full white and the icon's stroke up with it. */
 .pBtn:hover{color:var(--c950);box-shadow:var(--rim-3)}
 .pBtn:hover svg{stroke-width:var(--ico-stroke-strong)}
 .pBtn:active{transform:scale(var(--press-scale))}
 .pBtn:focus-visible{outline:var(--focus-w) solid var(--c950);outline-offset:var(--sp-2)}
 .pBtn svg{width:var(--ico-sm);height:var(--ico-sm);flex:0 0 auto}
 /* --accent-dark, not --accent: tokens.css defines --accent-dark as the accent's
    dark-ground rung (oklch 72%), and the mid-tone blue that carries white text on paper
    does not carry it on near-black. Same colour, the rung the ground asks for. */
 .pBtnGo{background:var(--accent);color:var(--c0);box-shadow:none;padding:0 var(--sp-32)}
 /* The primary cannot answer with ink -- it is already full-contrast on its own fill -- so it
    takes the one affordance the rule permits a large target instead: a hairline. No fill move. */
 .pBtnGo:hover{box-shadow:inset 0 0 0 var(--hair-w) var(--c0)}
 .pTeamCols{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-12)}
 /* rgb(var(--tc1)) / rgb(var(--tc2)) are the match's own team channels -- the
    same custom properties play.css:170-174 paints the goals with, so the picker
    and the pitch cannot drift apart. The fallbacks are play-engine's defaults. */
 /* THE RIM IS A box-shadow, NEVER A border (control system §2.2). The border added 3px to
    each column's box, which is exactly why these paddings never lined up with anything else
    on the page; an inset shadow renders identically and sits outside layout. */
 .pTeamCol{border-radius:var(--r-md);padding:var(--sp-12);min-height:calc(var(--tap-min) * 2 + var(--sp-30));border:0}
 /* On black the two sides read the other way round from the paper version: the tint goes UP
    in alpha and the header takes the team colour at full strength rather than a darkened
    print variant, because a 190,58,47 red on near-black is mud. */
 .pTeamCol.red{box-shadow:inset 0 0 0 var(--hair-w) rgba(var(--tc1,224,90,78),.45);background:rgba(var(--tc1,224,90,78),.055)}
 .pTeamCol.blue{box-shadow:inset 0 0 0 var(--hair-w) rgba(var(--tc2,90,160,216),.45);background:rgba(var(--tc2,90,160,216),.055)}
 .pTeamColHdr{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-8);margin-bottom:var(--sp-12);font-family:var(--sans);font-weight:600;font-size:var(--fs-micro);letter-spacing:var(--tr-caps);text-transform:uppercase}
 .pTeamCol.red .pTeamColHdr{color:rgb(var(--tc1,224,90,78))}
 .pTeamCol.blue .pTeamColHdr{color:rgb(var(--tc2,90,160,216))}
 .pTeamColN{font-weight:400;color:var(--c500);letter-spacing:var(--tr-flat)}
 .pTeamChips{display:flex;flex-wrap:wrap;gap:var(--sp-8);justify-content:center;align-content:flex-start}
 /* 88x104: the chip was 40x48 in the popover, which is a thumbnail. At this size it is a
    head -- you can tell whose face is on which side across the room, which is the only
    thing the screen is for. */
 .teamChip{width:calc(var(--tap-min) * 2);height:calc(var(--tap-min) * 2 + var(--sp-16));border-radius:var(--r-sm);overflow:hidden;border:0;cursor:pointer;padding:0;background:var(--c100);
  touch-action:none;-webkit-user-select:none;user-select:none;
  transition:transform var(--ease-out-dur) var(--ease-out)}
 .teamChip:hover{transform:translateY(-2px)}
 .teamChip:focus-visible{outline:var(--focus-w) solid var(--accent);outline-offset:2px}
 .teamChip img{width:100%;height:100%;object-fit:cover;display:block}
 /* The team ring comes off the border too, so a chip is exactly 88x104 whichever side it is
    on -- as a 2px border it was 88x104 PLUS 4px and the two columns' grids disagreed by a
    chip's worth across a full row. It rides an ::after rather than the chip's own inset
    shadow because the <img> is a 100%-size child: an inset shadow paints under content, so
    the photo covered the ring. The overlay paints over it and is pointer-events:none, so the
    drag handler still sees the button. */
 .teamChip{position:relative}
 .teamChip::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
 .teamChip.red::after{box-shadow:inset 0 0 0 var(--focus-w) rgb(var(--tc1,224,90,78))}
 .teamChip.blue::after{box-shadow:inset 0 0 0 var(--focus-w) rgb(var(--tc2,90,160,216))}
 .teamChip:focus-visible{outline:var(--focus-w) solid var(--c950);outline-offset:var(--sp-2)}
 .pTeamCol.dragOver{outline:var(--focus-w) dashed var(--c500);outline-offset:-3px}
 .pTeamCol.red.dragOver{background:rgba(var(--tc1,224,90,78),.14)}
 .pTeamCol.blue.dragOver{background:rgba(var(--tc2,90,160,216),.14)}
 .pTeamFoot{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-12);margin-top:var(--sp-12)}
 .pTeamHint{font-family:var(--sans);font-size:var(--fs-caption);letter-spacing:var(--tr-body);color:var(--c500)}

 /* ---- PHONE. The mobile audit calls this the site's best mobile page and the
    budget that makes it so is vertical: .hero is 65vh here (play.css:305) and
    the feet land near 80vh, leaving ~170px under them. So the cards drop their
    description and go 2x2 -- icon and title only, still a 66px target, still
    four doors. --blur-1/2 are already 0 below 760px, and nothing here asks for
    a backdrop-filter at any width. ---- */
 @media(max-width:760px){
  .pHub{padding-top:calc(var(--nav-h) + var(--sp-40) + var(--sp-8));padding-bottom:var(--sp-16)}
  .pCards{grid-template-columns:1fr 1fr;gap:var(--sp-8)}
  .pCard{padding:var(--sp-10) var(--sp-12);gap:var(--sp-4);min-height:calc(var(--tap-min) * 1.5)}
  .pCardD{display:none}
  /* THE ONE PLACE THE PHONE RUNS OUT OF ROOM. Measured at 390x844: .hero is 65vh here
     (play.css:305), so the shared feet line lands at 673 and the two rows of cards begin at
     668 -- the heads' lower 65px were behind the menu. The title block and the crowd strip
     are already as tight as they read, and the cards cannot go lower (they are on the
     bottom gutter), so the stage is what gives: 57vh puts the feet at 638 with 30px of
     clear ground under them. Only while the hub is up -- the match gets the full band back,
     because .pHubOn comes off before kickoff. syncHub() dispatches a resize when this class
     changes so the engine re-surveys the floor through its own tested path. */
  body.pHubOn .hero{height:57vh}
  .pTeamIn{padding:var(--sp-12)}
  .pTeamCols{gap:var(--sp-8)}
  .pTeamCol{padding:var(--sp-8);min-height:calc(var(--tap-min) * 2 + var(--sp-8))}
  .teamChip{width:calc(var(--tap-min) + var(--sp-12));height:calc(var(--tap-min) * 1.5)}
  .pTeamFoot{flex-direction:column;align-items:stretch}
  .pTeamHint{text-align:center;order:2}
  .pBtnGo{width:100%}
 }
 /* NOTE FOR WHOEVER LANDS THE HEAD-LEVEL DELETE: --tap-min is already the floor everywhere
    on this page, and the X-on-a-head pattern being designed for the home dropdown and the
    maker should arrive here unchanged rather than as a fourth variant. */

 /* ---- #tHeadEdge's flood, made REACHABLE rather than changed.
    The filter floods the cut-out's edge ring with #FDFDFD -- an invisible cut-line on
    paper, a bright white keyline on black. Checked before assuming: on this page the only
    consumer is `.tCardHead img` (play.css:958), the tournament's card portraits, and those
    cards are still paper, so #FDFDFD is still the right answer THERE and nothing about
    today's rendering changes. What was wrong is that the value was welded into a
    presentation attribute in the markup. flood-color is a real CSS property on feFlood, so
    one rule turns it into a token with the old value as its default: whoever takes the
    tournament dark sets --head-edge next to the ground they set, in the same pass, instead
    of discovering it in a screenshot. ---- */
 #tHeadEdge feFlood{flood-color:var(--head-edge)}
</style>

<!-- FIX ROUND 2 (Task 2): filter defs SHARED with index.html:2316-2318, copied verbatim, not moved -- index.html keeps its own copies. Must be inlined here, not linked: Safari does not support filters referenced from an external or data: URL (see index.html's own comment on tHeadEdge). #tHeadEdge is unused on play.html today but Task 4's tournament head edges need it. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><!-- Cut-out edge stroke. NOT a drop-shadow stack: CSS filter functions CHAIN, each taking the previous one's output, so N shadows compound to about (N/pi)*r rather than r -- 8 at 1px measures ~2.5px, and 24 hangs the compositor outright. Worse, a stack outlines every hair strand separately and turns a photographic head into a spiky halo. Threshold the alpha FIRST so wispy strands collapse into one silhouette, dilate that, subtract to leave a ring, and flood it. One clean line, hair keeps its softness. Must be inline in this document: Safari does not support filters referenced from an external or data: URL. --><filter id="tHeadEdge" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="b"/><feComponentTransfer in="b" result="sil"><feFuncA type="linear" slope="20" intercept="-13.5"/></feComponentTransfer><feMorphology in="sil" operator="dilate" radius="1" result="f"/><feComposite in="f" in2="sil" operator="out" result="r"/><feFlood flood-color="#FDFDFD" result="c"/><feComposite in="c" in2="r" operator="in" result="st"/><feMerge><feMergeNode in="st"/><feMergeNode in="SourceGraphic"/></feMerge></filter></svg>
