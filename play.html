<style>
 /* The arena carries class="hero" deliberately: the engine measures ".hero" in
    16 places. Renaming those is a later pass; see spec 5.1. */
 html,body{margin:0;height:100%;background:var(--paper,#f7f6f3);overflow:hidden}
 /* COMPOSITION (fix round 2): the engine derives its entire floor plane from
    hero.clientHeight (FLOORCAP, play-engine.js survey()) and every game element --
    ball, goals, heads, and the scoreboard itself (a .hero child; .hmScore's
    top:40px is relative to the band, not the viewport) -- is a flat .hero
    descendant. So a shorter, vertically-centred .hero pulls the whole scene up
    into a broadcast-style band with the scoreboard sitting just above it, with NO
    play-engine.js change: this is CSS-only. body becomes the centring flex
    container; .hero, as body's one in-flow child (the back link and the game menu
    are both position:fixed, out of flow), gets margin:auto to centre on both axes --
    though only the vertical axis has free space to give, since .hero still spans
    the full 100vw. See task-2-report.md's fix-round-2 addendum for the measured
    before/after and the mobile decision (play.css:146). */
 body{display:flex}
 .hero{position:relative;width:100vw;height:60vh;margin:auto}
 #face{display:none}
 .playBack{position:fixed;left:16px;top:16px;z-index:60}
 /* Task 3: #moodMenu's own base rule (play.css:152) sets neither left nor right, so its
    static position defaults to moodBtn's LEFT edge and grows rightward by its own width.
    Home gets away with that because a JS module (index.html:4273 clampMenuX, deliberately not
    ported here -- see play-games.js's menu-open-glue comment) measures at open-time and flips
    to right:0 when the menu "would leave the column". play.html's menu bar is pinned to the
    right edge (right:16px, below), so left-aligned growth runs the menu off the viewport's
    right edge every time -- measured 70px of overflow at 1280px wide, worse on anything
    narrower, and body's overflow:hidden (line 9) makes the overflow unreachable, not just
    ugly. Anchoring the menu to the SAME edge as the button it drops from is also just the
    correct static answer for a corner-pinned bar, not a workaround. */
 #moodMenu{left:auto;right:0}
</style>
</head><body class="hmFull">
<!-- FIX ROUND 2 (Task 2): filter defs SHARED with index.html:2316-2318, copied verbatim, not moved -- index.html keeps its own copies. Must be inlined here, not linked: Safari does not support filters referenced from an external or data: URL (see index.html's own comment on tHeadEdge). #tHeadEdge is unused on play.html today but Task 4's tournament head edges need it. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><!-- Cut-out edge stroke. NOT a drop-shadow stack: CSS filter functions CHAIN, each taking the previous one's output, so N shadows compound to about (N/pi)*r rather than r -- 8 at 1px measures ~2.5px, and 24 hangs the compositor outright. Worse, a stack outlines every hair strand separately and turns a photographic head into a spiky halo. Threshold the alpha FIRST so wispy strands collapse into one silhouette, dilate that, subtract to leave a ring, and flood it. One clean line, hair keeps its softness. Must be inline in this document: Safari does not support filters referenced from an external or data: URL. --><filter id="tHeadEdge" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="b"/><feComponentTransfer in="b" result="sil"><feFuncA type="linear" slope="20" intercept="-13.5"/></feComponentTransfer><feMorphology in="sil" operator="dilate" radius="1" result="f"/><feComposite in="f" in2="sil" operator="out" result="r"/><feFlood flood-color="#FDFDFD" result="c"/><feComposite in="c" in2="r" operator="in" result="st"/><feMerge><feMergeNode in="st"/><feMergeNode in="SourceGraphic"/></feMerge></filter></svg>
<svg width="0" height="0" style="position:absolute"><filter id="inkBig"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G" result="d"/><feTurbulence type="fractalNoise" baseFrequency="0.5 0.42" numOctaves="2" seed="13" result="g"/><feColorMatrix in="g" type="matrix" values="0 0 0 0 0.055 0 0 0 0 0.055 0 0 0 0 0.055 0 0 0 0.42 0" result="grain"/><feComposite in="grain" in2="d" operator="atop"/></filter>
<filter id="inkSm"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0.55" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="inkEye"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.05" xChannelSelector="R" yChannelSelector="G"/></filter></svg>

<div class="moodbar" id="moodbar" style="position:fixed;right:16px;top:16px;z-index:60">
 <button class="moodBtn" id="moodBtn" type="button" aria-label="Play" aria-expanded="false" aria-controls="moodMenu"><span class="moodLbl">Play</span><svg class="moodCar" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg></button>
 <div class="moodMenu" id="moodMenu">
  <div class="moodRow" id="soccerRow"><button class="moodItem" id="soccerGo" type="button" aria-label="Start a soccer match between your heads"><svg class="gIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/> <path d="M12 7l4.76 3.45l-1.76 5.55h-6l-1.76 -5.55l4.76 -3.45"/> <path d="M12 7v-4m3 13l2.5 3m-.74 -8.55l3.74 -1.45m-11.44 7.05l-2.56 2.95m.74 -8.55l-3.74 -1.45"/></svg>Soccer</button><button class="moodTeamsBtn" id="soccerTeams" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Choose soccer teams"><span class="tdotR" aria-hidden="true"></span><span class="tdotB" aria-hidden="true"></span></button></div>
  <button class="moodItem" id="tourGo" type="button" aria-label="Start a soccer tournament — single elimination, one match at a time, with goals, assists and ratings tracked"><svg class="gIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M2 4a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/> <path d="M18 10a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/> <path d="M2 12a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/> <path d="M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/> <path d="M6 12h3a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-3"/> <path d="M6 4h7a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-2"/> <path d="M14 10h4"/></svg>Tournament</button>
  <button class="moodItem" id="endGame" type="button" aria-label="End the current game" style="display:none"><svg class="gIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 7a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2l0 -10"/></svg>End game</button>
 </div>

<script>
/* DEV-ONLY, opt-in via ?wraf=1 — copied from index.html:2468-2475 verbatim.
   Without this, every ?wraf=1 verification step in this plan silently runs on
   native rAF and freezes the moment the tab loses focus. */
(function(){try{if(!/[?&]wraf=1/.test(location.search))return;
 var blob=new Blob(["var t=setInterval(function(){postMessage(0);},15);onmessage=function(){};"],{type:"application/javascript"});
 var w=new Worker(URL.createObjectURL(blob)),q=[],nid=1;
 w.onmessage=function(){var cbs=q;q=[];var now=performance.now();for(var i=0;i<cbs.length;i++){try{cbs[i].fn(now);}catch(e){}}};
 window.requestAnimationFrame=function(fn){var h=nid++;q.push({h:h,fn:fn});return h;};
 window.cancelAnimationFrame=function(h){for(var i=0;i<q.length;i++){if(q[i].h===h){q.splice(i,1);break;}}};
}catch(e){}})();
</script>
