/* ═══ STRATA, ON A PAGE OF ITS OWN.  2026-09-01, Jayden: "the game itself should be on
   its own page you can open like the rest." The Play menu's Strata cell opens this;
   the head maker and the gradient lab open the same way. The header is the site's,
   copied byte for byte from headmaker.html (Back goes to play.html), and the page
   has no footer for the same reason those two have none: it is an app, not a read.

   THE PHONE IS THE STUDY'S PHONE. strata.html frames the same Lovable build in a
   390/844 shell with the device's own corner (clamp(22px,2.4vw,30px), a picture of a
   phone and not a rung on the ladder -- the note beside .demoPhone there says why).
   Here the shell is sized off the HEIGHT that is left under the bar, so the whole
   app is on screen with nothing to scroll, and on a phone it simply is the phone:
   no shell, no corner, edge to edge under the bar.

   NO POSTER, NO PLAY-WITH-SOUND STEP. On the study the iframe waits for a click so a
   reader who never plays never fetches it. Here the visitor already clicked to come,
   so the app loads at once. Sound is the app's own business. */
.skipLink{position:fixed;top:var(--sp-10);left:var(--sp-10);z-index:200;
 display:inline-flex;align-items:center;min-height:var(--tap-min);
 padding:0 var(--sp-16);background:var(--mat-3-solid);color:var(--c950);
 box-shadow:var(--rim-2);border-radius:var(--r-md);corner-shape:var(--corner);
 font-family:var(--sans);font-weight:400;font-size:var(--fs-small);
 line-height:var(--lh-flat);text-decoration:none;
 transform:translateY(calc(-100% - var(--sp-16)));
 transition:transform var(--ease-out-dur) var(--ease-out)}
.skipLink:focus{transform:translateY(0);outline:var(--focus-w) solid var(--c950);outline-offset:var(--sp-2)}
@media(prefers-reduced-motion:reduce){.skipLink{transition:none}}
/* the UA's 8px body margin, which headmaker.html zeroes in its own sheet too */
body{margin:0}
.stApp{box-sizing:border-box;min-height:calc(100svh - var(--bar-h));display:grid;place-items:center;padding:var(--sp-24) var(--sp-16)}
.stPhone{height:min(844px,calc(100svh - var(--bar-h) - 2 * var(--sp-24)));width:auto;max-width:100%;aspect-ratio:390/844;
  border-radius:clamp(22px,2.4vw,30px);overflow:hidden;background:var(--c50);box-shadow:var(--rim-1)}
.stFrame{display:block;width:100%;height:100%;border:0}
@media(max-width:640px){
 .stApp{padding:0;min-height:0}
 .stPhone{width:100%;height:calc(100svh - var(--bar-h));aspect-ratio:auto;border-radius:0;box-shadow:none}
}
</style>

        Jayden asked for a Contact that is noticeable but does not compete with the
        hero's "View work"; .ctl--secondary is that kind in this system, and it is
        the same treatment as the sun button beside it.
        WHAT WENT WITH THE DROPDOWN: the .jbDisc wrapper, #jbContactMenu and its
        three rows, aria-haspopup / aria-expanded / aria-controls, the chevron, and
        header.js's whole disclosure block -- a listener bound to markup that no
        longer ships is the defect, not the leftover, and aria-expanded on a link
        with nothing to expand is a lie a screen reader reads out loud.
        The three destinations are not lost: the footer carries LinkedIn, Instagram
        and Email in the same order on every page, which is where the panel's own
        round-10 note already said the fallback lived. -->
