     canonical; play.html is noindex; this page was noindex with no description, no
     canonical and no icons -- which reads less like a decision than like a page
     nobody had got to yet. Two of the three tools being hidden and the third
     promoted is a choice worth making on purpose. It is flagged in
     docs/superpowers/specs/2026-08-11-seo-safari-audit.md and deliberately NOT
     changed here.

     NO CANONICAL, DELIBERATELY -- see the note in play.html. Not in sitemap.xml
     either, because listing a noindex URL in a sitemap is a self-contradiction that
     Search Console reports as an error against the whole file. -->

<!-- THE SHARED DESIGN TOKENS. There is no longer a page-local palette for them to
     lose to: --paper/--ink/--sub/--hair/--panel are gone and every rule in the block
     below reads a shared token. What is still true is the load order -- tokens first,
     page after, so a page-local geometry constant can be built out of a token.
     See .superpowers/sdd/2026-08-02-play-page/play-tokens-report.md §1. -->
<link rel="stylesheet" href="tokens.css?v=57fb92263c">
<style>
  /* THE @font-face PAIR THAT USED TO SIT HERE IS GONE, and deleting it is the
     point rather than a tidy-up. tokens.css:62 now declares both weights for the
     whole site precisely because six per-page copies existed and two pages never
     got one -- about.html and play.html rendered SF Pro. This was the seventh
     copy, and it survived that pass only because this file was being rewritten
     at the same time. Verified after removal with document.fonts.check() and by
     measuring a 600/40px string against a forced system fallback: 626.77 vs
     595.46, so the webfont is what is actually rendering, not just declared. */
  /* ══ ONE PAGE-LOCAL NAME, AND IT IS THE LAST ONE ═════════════════════════
     The block that used to sit here bound --paper/--ink/--sub/--hair/--panel to
     Lab-only near-misses of tokens that already existed (#f8f9fa vs --c50,
     #232323 vs --c900, #75756e vs --c500, #e7e6e1 vs --c100) -- five names for
     values the system had already named, which is precisely the drift the token
     layer exists to stop.

     THE THREE BUILDER CONSTANTS THAT REPLACED THEM ARE ALSO GONE, and that is
     the better outcome: --panel-w, --bar-h and --lbl-w are all in tokens.css now
     (494, 518, 519), including --lbl-w's 420px fork to 72px at :521. This page
     and headmaker.html are one archetype, so a geometry both of them use belongs
     to neither of them. Nothing is declared locally to shadow them.

     --ok is what is left: SUCCESS, a different idea from --accent that happens
     to be a colour, so it gets its own name rather than a rebinding. */
  :root{
    --ok:#0E6B3B;
  }
  *{box-sizing:border-box}
  /* overflow-x:clip is what the other nine pages already carry and this one did
     not (mobile audit, method note). It is not covering anything up here -- the
     halo bleed that used to cause a real sideways scroll is fixed structurally
     by the stage card -- but a CLASSIC scrollbar shrinks clientWidth while the
     fixed bar still sizes to the initial containing block, which reads as 20px
     of horizontal overflow at 320 the moment the short-viewport release lets the
     page scroll. clip, never hidden, so this never becomes a scroll container. */
  html,body{height:100%;overflow-x:clip}
  body{margin:0;background:var(--c50);color:var(--c950);
    font-family:var(--sans);font-size:var(--fs-nav);line-height:var(--lh-body);
    letter-spacing:var(--tr-body)}

  /* ══ THE FRAME ═══════════════════════════════════════════════════════════
     A BUILDER, NOT A DOCUMENT. One viewport, no page scroll: the artifact holds
     the centre and the inspector sits beside it. 100svh rather than 100vh
     because on iOS Safari vh resolves against the LARGE viewport, so a 100vh
     app frame runs its last controls under the toolbar with no way to reach
     them -- the same reason the old panel needed 100dvh.

     THE GUTTER IS THE SITE'S GUTTER, AND THE MEASURE IS THE SITE'S MEASURE.
     This page measured 30 / 14 against every other page's 40 / 24 (geometry
     audit §4.4) -- it predated --sp-40, which exists precisely to name the 40px
     site gutter. --page-max + margin-inline:auto is the other half, and it is
     not optional: without it the content edge sits at 40 while every other page
     -- AND the bar itself, capped at --bar-open 1200 and centred -- resolves to
     120 on a 1440 screen. Measured on index.html at 1440: .wrap 120, .jbNav 120.
     Now: 120 / 120 / 120 here too. Top inset derives from --bar-h so it cannot
     drift if the bar's own padding changes.

     WHAT FOLLOWS THE BAND IS NOW THE SITE'S VALUE TOO. --bar-h is the band; the
     inset below it was chosen per page and the nine pages disagreed by 5.4x.
     Measured band-bottom (72px) to first paint before this pass: about 16 / 24,
     case studies 48 / 56, headmaker 84 / 88, this page 78 / 88, at 390 / 1440.
     Jayden: "spacing on phone feels a bit odd ... or just too much space."
     One rung now, --sp-32-48 -- 32 on a phone, 48 from 881 up. No new token.
     On a 100svh frame the pixels it returns on a phone all go to the orb.

   THE BAND IS IN THE FLOW, AND --bar-h WAS RESERVING IT A SECOND TIME.
   Measured at 390x844 and 1440x900, both tool pages: .jbStick computes
   position:sticky with className exactly "jbStick" -- header.css's comment says
   these pages "ship .isFixed" and the markup does not carry it -- so the wrapper
   occupies its full 72px of FLOW and the lab box starts at y=72. On top of that
   the app reserved --bar-h (14+52+6 = the same 72) inside its own padding-top,
   and then asked for height:100svh. Two consequences, both measured:
     1. documentElement.scrollHeight 916 in an 844 viewport. A page whose entire
        premise is one viewport, scrolling by exactly the height of the bar, with
        the bottom of the inspector under the fold. Jayden has objected to
        unwanted scroll four separate times.
     2. 84px of air between the band's hairline and the card at 390, against the
        case studies' 48 and about's 16.
   THE HEIGHT NOW SUBTRACTS THE BAND AND THE PADDING NO LONGER ADDS IT. Same
   token on both sides, so they cannot drift apart. After: scrollHeight == the
   viewport at both sizes, and the card gains 36px of visible height on a phone.
   IF .jbStick EVER GAINS .isFixed the wrapper leaves the flow and this inverts --
   the height must go back to a bare 100svh and --bar-h back into padding-top.
   tools/structure-rule-contract.py asserts scrollHeight == innerHeight on both
   pages so that regression cannot land quietly. */
  .lab{display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);
    gap:var(--sp-24);height:calc(100svh - var(--bar-h));
    max-width:var(--page-max);margin-inline:auto;
    padding:var(--sp-32-48) var(--sp-40) var(--sp-24)}

  /* ══ THE STAGE ═══════════════════════════════════════════════════════════
     GROUND MODE. What the orb is judged against — not the orb itself and not
     the panel. Default is --c50, the site's paper. JS drives the live value
     inline; this rule is only the first paint before the script runs.

     THE CARD IS ALSO THE OVERFLOW FIX AND THE HEADER FIX. .haloWrap is
     inset:-26% around .orbWrap and used to hang 36px off the right edge at
     390px -- the site's one real two-dimensional scroll and its one 400%-zoom
     reflow failure (mobile audit B2). overflow:hidden on a card that is inset
     from the viewport removes that structurally rather than by clipping the
     page. And because the card starts BELOW the bar, the user's stage colour
     never reaches the header -- which is the whole reason the header could be
     ink and can now be light. */
  .stage{position:relative;display:flex;align-items:center;justify-content:center;
    min-width:0;min-height:0;overflow:hidden;
    border-radius:var(--r-lg);corner-shape:var(--corner);
    background:var(--c50)}
  /* the card's edge is an ::after ring, not an inset box-shadow: an inset shadow
     paints under the canvas, so on a full-bleed gradient the rim would vanish */
  .stage::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
    border-radius:inherit;corner-shape:var(--corner);box-shadow:var(--rim-2)}
  .bgHost{position:absolute;inset:0;display:none;overflow:hidden}
  .stage.bgMode .bgHost{display:block}
  .stage.bgMode .orbWrap{display:none}
  /* sized against the CARD, not the viewport. cqmin keeps the orb square inside
     a box of any proportion and leaves 20% of the short side clear on each edge,
     which is more than the halo's 26%-of-orb bleed needs -- so the glow is never
     clipped by the very rule that stops it escaping the page. */
  .orbWrap{position:relative;width:min(430px,72%);aspect-ratio:1;--R:215px}
  .orbWrap.orb2{position:absolute;width:min(300px,50%);right:6%;top:7%;--R:150px}
  .orbWrap.orb3{position:absolute;width:min(215px,36%);left:7%;bottom:6%;--R:107px}
  @supports (container-type:size){
    .stage{container-type:size}
    .orbWrap{width:min(430px,60cqmin)}
    .orbWrap.orb2{width:min(300px,42cqmin)}
    .orbWrap.orb3{width:min(215px,30cqmin)}
  }
  .haloWrap{position:absolute;inset:-26%;pointer-events:none;mix-blend-mode:multiply}
  .halo{position:absolute;inset:0;border-radius:var(--r-full);overflow:hidden;
    filter:blur(calc(var(--R)*0.34));opacity:var(--haloA,.5)}
  /* the halo may only ever FADE — the radial mask kills the pale ring where the
     glow canvas used to terminate at its circle's rim */
  .halo canvas{position:absolute;inset:-8%;width:116%;height:116%;display:block;
    -webkit-mask-image:radial-gradient(closest-side,#000 28%,transparent 76%);
    mask-image:radial-gradient(closest-side,#000 28%,transparent 76%)}
  .discClip{position:absolute;inset:0;border-radius:var(--r-full);overflow:hidden;
    isolation:isolate;transform:translateZ(0)}
  .discClip::after{content:"";position:absolute;inset:0;border-radius:var(--r-full);
    pointer-events:none;z-index:2;box-shadow:var(--volSh,none)}
  .discClip canvas,.bgHost canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ══ THE INSPECTOR ═══════════════════════════════════════════════════════
     A flex COLUMN with one flexible row (the tab body) and three fixed ones:
     the tool's name, the tab strip, and the actions. The actions never leave the
     screen, which is what "one primary action" means on a page with 30 controls.
     Light surface, hairline rim, NO cast shadow -- the panel separates from the
     paper by material and an edge, never by elevation. No backdrop-filter
     either: --blur-1/2 are zeroed below 760px, so anything leaning on blur needs
     a solid fallback, and a solid white panel simply does not need the blur. */
  .panel{display:flex;flex-direction:column;gap:var(--sp-12);min-height:0;
    padding:var(--sp-16);
    border-radius:var(--r-lg);corner-shape:var(--corner);
    background:var(--c0);box-shadow:var(--rim-2)}

  /* the tool names itself at the head of its own inspector rather than floating
     a plate over the artifact -- and it is the page's h1, which this page did
     not previously have at all */
  .labHead{display:flex;align-items:baseline;justify-content:space-between;
    gap:var(--sp-8);min-height:var(--sp-24)}
  .labHead h1{margin:0;font-size:var(--fs-small);font-weight:600;
    letter-spacing:var(--tr-title);color:var(--c950)}
  .labHead span{font-size:var(--fs-micro);letter-spacing:var(--tr-caps);
    text-transform:uppercase;color:var(--c500);white-space:nowrap}

  /* ══ CONTROLS ════════════════════════════════════════════════════════════
     docs/superpowers/specs/2026-08-03-control-system.md §2: one base, and a
     kind may vary only background / box-shadow / colour / font-weight. Height
     is min-height and never vertical padding -- which is the whole of why this
     page used to carry `7px 11px` and `9px 12px`, someone padding TO a height
     they never named (geometry audit §4.1, 58 occurrences). The rim is a
     box-shadow, never a border. The press is scale, never translateY.

     THE TYPE IS --fs-small (15px), NOT --fs-label (13). This shipped at 13 for
     density and that was the wrong lever: 15 is --ctl-fs, it is what the header
     and the case studies already render, and it is what headmaker.html -- the
     same archetype -- has. A 13px control label beside a 15px one is the
     pick-and-choose conformance Jayden is objecting to. The spec already ships a
     mechanism for density, and it is .is-sm's 36px box with a 44px ::after, not
     a second type scale. Measured after the change, no group needs it. */
  /* THE BASE, THE KINDS AND THEIR STATES ARE GONE FROM THIS FILE. Every line
     that used to sit here -- .ctl, its four state rules, .ctl--icon, .ctl--secondary
     and .ctl--primary -- is now controls.css's, linked below the block. What the
     copy said and what the library says agreed on geometry and disagreed on
     material: the primary's fill read --accent (#090b24) rather than
     --ctl-primary-ground (--theme-ink, #111214) and it carried no rim at all,
     so this page's one emphasis control was a different object from the same
     control on every other page. Deleting the copy is what makes retuning
     --ctl-* reach this page; keeping it is what guaranteed it never would.
     WHAT SURVIVES BELOW IS LAYOUT ONLY, which is the whole of what a page is
     allowed to say about a control. */
  /* the panel foot is a flex row: the icon buttons hold their 44px square and
     the one primary action takes the rest of it. */
  .ctl--icon{flex:0 0 auto}
  .ctl--primary{flex:1 1 auto}
  /* SUCCESS, briefly, on the copy button. --ok is a different idea from --accent
     that happens to be a colour, so it keeps its own name; the ink channel is the
     library's own, which is why this can stay one declaration. */
  .ctl.is-ok{color:var(--ok)}

  /* ── the tab strip: five groups, one visible at a time. This is REDUCTION,
     not a scrollport: 30 controls in one column is what made the old panel a
     844px-tall scroller with its last rows unreachable. Full 44px segments --
     the compact 36px rung needs a >=44px container and >=8px between expanded
     hit areas (§4.2), and a segmented control has neither. */
  /* THE STRIP IS LAYOUT; THE TAB IS THE LIBRARY'S. .ctl--tab used to be redrawn
     here -- its own ink, its own selected weight, and its own underline hung off
     a .ctlLbl span -- which is how one role came to render three different ways
     across the site (audit §2.1). controls.css already ships exactly the design
     this page argued for: hover is the grey pill and never touches the selected
     tab, selection is ink + 600, and the underline is a third channel. So the
     three channels stay and the second implementation of them goes.
     THE TYPE STAYS 15px. .ctl--tab reads `font-size:inherit` by design -- a tab
     takes the scale of the strip it sits in -- so the strip declares --ctl-fs and
     the measurement that justified it (longest label 46.3px at 15/600 inside a
     52.4px track at 390) still holds. */
  .tabs{display:flex;gap:var(--sp-4);font-size:var(--ctl-fs)}
  .tabs>.ctl--tab{flex:1 1 0;min-width:0;padding-inline:var(--sp-4)}
  /* the underline follows the tab's own inset rather than the 44px rung's 16px,
     which on a 60px track would leave it shorter than the word it belongs to. */
  .tabs>.ctl--tab::after{left:var(--sp-4);right:var(--sp-4)}

  /* ── THREE STATES, THREE CHANNELS, AND NONE OF THEM USED TWICE. Control-system
     spec §3.4, amended in this pass -- the reasoning is recorded there and the
     short version is that the selected tab USED to be a --c75 pill with 600 ink,
     and that is now the site's signature for HOVER. header.css:249 binds
     --nav-hover-bg to --c75 and --accent-wash was repointed to the same #f1f1f4
     so the site has one interaction ground. Grey pill + ink + 600 therefore means
     "your cursor is here" everywhere, and a tab that wore it at rest meant
     hovering an unselected tab made it look selected.

     header.css's lit nav pill is a real precedent and it is NOT this case: there,
     the lit item's hover is a deliberate no-op, so nothing in that bar can be
     hovered into the selected appearance. A five-tab strip has no such
     protection, which is why the underline had to be a channel of its own.

     ALL THREE CHANNELS NOW COME FROM controls.css, which reached the same answer:
     `.ctl--tab:hover:not([aria-selected="true"])` fills with --ctl-ground-hover,
     `[aria-selected="true"]` takes --ctl-ink-strong at 600, and a ::after rule
     carries the underline. The measurement that used to justify the local copy
     still holds and is recorded in the spec: tab x-positions are
     [36, 100.4, 164.8, 229.2, 293.6] whichever tab is selected, because flex:1 1 0
     gives every tab an equal share whatever it contains, so the weight change
     reflows nothing.
     The .ctlLbl spans stay in the markup -- they are the label's box and cost
     nothing -- but they no longer carry an underline of their own. */

  /* ── the tab body. Rows are FLUSH: each is its own 44px target, so the 8px
     separation floor -- which exists to keep undersized targets apart -- has
     nothing to do here, and a stack of full-height rows reads as one list.
     overflow-y is a SAFETY VALVE, not a design: measured at 1440, 1280 and
     390x844 no group ever fills it. It fires only below roughly a 660px-tall
     desktop window, where the alternative is controls off the bottom. */
  .tabPanel{flex:1 1 auto;display:flex;flex-direction:column;align-content:flex-start;
    min-height:0;overflow-y:auto;overscroll-behavior:contain}
  .tabPanel[hidden]{display:none}

  /* ── THE THREE SELECTS SHARE BOTH EDGES ────────────────────────────────────
     Measured 2026-08-20: Preset's select was 176px wide against Form's and
     Shape's 232 -- a 56px stagger down the right edge of a three-row stack, at
     both viewports. Nobody authored that; it is what flex does when ONE row has
     a trailing button and the others do not. The select takes the remainder, and
     the remainder is 56px smaller exactly on the row that also has to hold the
     bookmark.
     A GRID, so the button column exists on every row whether or not that row
     fills it. Jayden's whole structure note is that things should look
     "intentionally on a grid that is connected" -- three controls that stop at
     three different x values is the opposite, and it is the kind of defect that
     measures fine per-row and reads wrong as a stack. The column is the icon
     button's own footprint (--tap-min) plus the gap, so nothing moves except the
     two rows that were previously over-long. */
  .row{display:grid;grid-template-columns:var(--lbl-w) minmax(0,1fr) auto;
    align-items:center;gap:var(--sp-12);min-height:var(--tap-min)}
  .row:has(>select.field--flex):not(:has(>button)){
    grid-template-columns:var(--lbl-w) minmax(0,1fr) var(--tap-min)}
  .row:has(>select.field--flex):not(:has(>button))::after{content:"";display:block}
  .row>label{flex:0 0 var(--lbl-w);min-width:0;font-size:var(--fs-label);color:var(--c700);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row>output{flex:0 0 var(--sp-28);text-align:right;font-size:var(--fs-caption);
    color:var(--c500);font-variant-numeric:tabular-nums}
  /* margin:0 is load-bearing, not tidiness -- .grpH is a <p>, and the UA's 1em
     top+bottom put 28px of invisible air into the tallest group and were the
     difference between the panel fitting a 390x844 phone and not */
  .grpH{margin:0;display:flex;align-items:flex-end;gap:var(--sp-8);
    min-height:var(--sp-28);padding-bottom:var(--sp-4);
    font-size:var(--fs-micro);font-weight:600;
    letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--c500)}

  /* ── THE SLIDERS ARE THE LIBRARY'S NOW. `.ctl--range` in controls.css.
     The block that used to sit here got the hard part right -- the geometry
     audit's finding that the 2px box was the bug and that the input's BORDER BOX
     has to be the hit area, because a ::-webkit-slider-thumb paints outside it
     and catches nothing -- and it is exactly that finding the primitive carries,
     so nothing measured here is lost. What it got wrong is that it was HERE: 26
     sliders drawn against raw ramps (--tap-min, --focus-w, --c100, --c950,
     --sp-20) with headmaker.html drawing the same control a second time under a
     different class name and a different thumb size and colour. The library was
     missing a slider, so both pages invented one, which is the same shape of
     failure as the two private copies of `.ctl` this file already deleted.
     Three things arrive with the move: hover, press and disabled, none of which
     26 of the site's 28 sliders had; a thumb focus ring that survives a coloured
     ground; and a filled track, which is what --ctl-range-value below is for.
     WHAT STAYS IS LAYOUT: .row places the slider, nothing here redraws it. */

  /* ── selects. The spec's FIELD kind (§3.6) is now a real primitive rather than
     a page-local drawing of one: `.field .field--select .field--flex` in
     controls.css. The argument this block used to make -- "a select at 28.5px
     next to a button at 44px is the loudest single inconsistency in Gradient Lab,
     and a form row cannot read as one object if its two halves are on different
     ladders" -- is exactly why the primitive exists, and the absence of one is
     the documented reason this page forked .ctl in the first place.
     ONE MEASURED CORRECTION CAME OUT OF THE MOVE. The old rule set
     background-color:var(--mat-3-solid) (#FDFDFD) and site-theme.css's
     `input,select,textarea{background-color:var(--theme-surface)}` loads after
     this block and quietly won, so the ground has been rendering #FFF, not the
     half-step-down this comment claimed. .field reads --ctl-ground, which IS
     --theme-surface, so the file now says what the page actually draws. The rim
     moves with it, --rim-1 (.08) -> --ctl-rim (.12), which is the site's hairline
     and the only thing separating the field now that the ground is not. */

  /* ── THE COLOUR WELLS ARE THE LIBRARY'S NOW. `.ctl--swatch` in controls.css.
     The rule this replaces had reached the right instinct for the wrong reason:
     it used --rim-2 "because the one swatch that has to stay visible is a
     near-white one", which is true and is why the primitive's rim is two-tone
     rather than merely stronger. --rim-2 is a fixed rgba(9,11,36,.14) and does
     not invert, so the argument it was making held in daylight and failed at
     night, where a near-BLACK well loses its edge against a dark panel and a
     dark rim cannot help it. It also measured 1.15:1 in the case it was written
     for. The primitive's outer ring is 3.05:1 by construction, in both themes.
     TWO VISIBLE CHANGES CAME OUT OF THE MOVE, both deliberate. The well is
     --ctl-r rather than --r-full: a 44px circle is a 22px radius, on no rung of
     the ladder, and this row now has ONE radius in it instead of two -- the
     five wells and the shuffle button beside them are the same shape. And the
     well gained a SELECTED ring, wired below to the Nodes tab's own selection,
     so the palette says which colour the other tab is editing.
     WHAT STAYS IS LAYOUT: the row, and the digit under each well. */
  .swRow{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-8);
    min-height:var(--tap-min)}
  .sw{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);
    font-size:var(--fs-micro);color:var(--c500);font-variant-numeric:tabular-nums}

  /* ── the action row, always on screen */
  .panelFoot{display:flex;align-items:center;gap:var(--sp-8)}
  /* the one warning surface on the page; #8A3030 is a page-local error ink the
     ramp has no rung for -- it is not a rebinding of anything */
  .glErr{margin:0;display:none;color:#8A3030;font-size:var(--fs-caption)}
  /* the export snippet is ~200 lines of shader source. Nobody reads it on a
     screen; they copy it. Keeping it as a 190px scrollport was the page's last
     scroller and its ugliest object, so it stays in the DOM for the clipboard
     and out of the layout. */
  #code{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip-path:inset(50%);white-space:pre;border:0}

  /* ══ THE PHONE ═══════════════════════════════════════════════════════════
     Artifact above, inspector below, still one viewport. Two fr rungs rather
     than `auto` on the panel: an auto track is content-sized and would push the
     stage off the bottom on the fattest group, whereas two fractions can never
     sum past the frame. The gutter forks to --sp-24 at 760 because that is
     where the rest of the site's does. */
  @media(max-width:880px){
    .lab{grid-template-columns:minmax(0,1fr);
      grid-template-rows:minmax(0,.38fr) minmax(0,1fr);

  function hexToHsl(hex){
    var n=parseInt(hex.slice(1),16),r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255;
    var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2,d=mx-mn;
    if(d){s=l>0.5?d/(2-mx-mn):d/(mx+mn);
      h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60;}
    return{h:h,s:s*100,l:l*100};
  }

      var v=l-c*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));
      return Math.round(v*255).toString(16).padStart(2,"0");};
    return "#"+f(0)+f(8)+f(4);
  }

    return "inset calc(var(--R)*"+(ux*0.12).toFixed(3)+") calc(var(--R)*"+(uy*0.12).toFixed(3)

  var loadingPreset=false;
  function markCustom(){if(!loadingPreset)els.preset.value="-1";}

  /* ---- scenes: companion orbs, hue-rotated, composed like the board's
     multi-orb poster. A stage feature — the export stays solo. ---- */
  var sceneOrbs=[];
  function hueRotHex(hex,deg){var h=hexToHsl(hex);return hslToHex(h.h+deg,h.s,h.l);}
  function sceneCfg(v,deg){
    var c={};for(var k in v)c[k]=v[k];
    c.colors=v.colors.map(function(x){return hueRotHex(x,deg);});
    c.nodes=nodes;c.orb=1;c.form=0;
    return c;
  }
  function teardownScene(){
    sceneOrbs.forEach(function(o){if(o.mesh)o.mesh.destroy();o.wrap.remove();});
    sceneOrbs=[];
  }
  function buildScene(n){
    teardownScene();
    var degs=[30,-40],cls=["orb2","orb3"];
    for(var i=0;i<n-1;i++){
      var wrap=document.createElement("div");
      wrap.className="orbWrap "+cls[i];
      wrap.innerHTML='<div class="haloWrap"><div class="halo"><canvas></canvas></div></div>'
        +'<div class="discClip"><canvas></canvas></div>';
      $("stage").appendChild(wrap);
      var c=sceneCfg(cfg(),degs[i]);
      c.haloCanvas=wrap.querySelector(".halo canvas");
      var m=FluidMesh(wrap.querySelector(".discClip canvas"),c);
      var w=wrap.getBoundingClientRect().width;
      wrap.style.setProperty("--R",(w/2).toFixed(0)+"px");
      sceneOrbs.push({wrap:wrap,mesh:m,deg:degs[i]});
    }
  }

  function loadNodeSliders(){
    var nd=nodes[+els.nodeSel.value];
    els.nx.value=Math.round(nd.x*100);els.ny.value=Math.round(nd.y*100);
    els.nsize.value=Math.round(nd.size*100);
    els.nlen.value=Math.round(nd.len/0.0035);
    els.nang.value=Math.round(nd.ang*180/Math.PI);
    syncOutputs();markSelectedSwatch();
  }
  function saveNodeSliders(){
    var nd=nodes[+els.nodeSel.value];
    nd.x=+els.nx.value/100;nd.y=+els.ny.value/100;
    nd.size=Math.max(.1,+els.nsize.value/100);
    nd.len=+els.nlen.value*0.0035;
    nd.ang=+els.nang.value*Math.PI/180;
  }

  function apply(){
    var v=cfg();
    if(mesh)mesh.set(v);
    var haloA=+els.haloA.value/100;
    $("halo").style.setProperty("--haloA",haloA.toFixed(2));
    if(!mesh)$("halo").style.background=fallbackHalo(v,haloA);
    $("discClip").style.setProperty("--volSh",volShadow(v));
    var orb=(els.shape.value==="orb");
    $("stage").classList.toggle("bgMode",!orb);
    var canvas=$("fluid");
    var host=orb?$("discClip"):$("bgHost");
    if(canvas.parentNode!==host)host.insertBefore(canvas,host.firstChild);
    /* contextual controls: each Form shows only the sliders that shape it */
    $("bendRow").style.display=(v.form===1||v.form===2||v.form===4)?"":"none";
    $("bendLbl").textContent=(v.form===2)?"Drape angle":(v.form===4)?"Pleat angle":"Bend";
    $("foldRow").style.display=(v.form===2||v.form===4)?"":"none";
    $("foldRow").querySelector("label").textContent=(v.form===4)?"Pleats":"Fold";
    $("sheenRow").style.display=(v.form===2||v.form===4)?"":"none";
    $("dressSec").style.display=orb?"":"none";
    els.edgeF.closest(".row").style.display=orb?"":"none";
    els.fringe.closest(".row").style.display=orb?"":"none";
    /* scenes live on the Planet stage only; teardown everywhere else */
    var wantScene=orb?+($("scene").value):1;
    if(wantScene>1&&sceneOrbs.length!==wantScene-1)buildScene(wantScene);
    if(wantScene===1&&sceneOrbs.length)teardownScene();
    sceneOrbs.forEach(function(o){
      if(o.mesh)o.mesh.set(sceneCfg(v,o.deg));
      o.wrap.style.setProperty("--haloA",haloA.toFixed(2));
    });
    writeCode(v,orb,haloA);
  }
  /* ---- stage ground: what the orb is judged against, not what it renders as.
     All four now map to tokens.css — --c0 is the ramp's top rung (added by the
     header-v2 pass) and retires the last raw #fff on this page. Purely a
     stage-level background-color swap — never touches cfg(), the shader, a
     preset, or writeCode()'s export. */
  var STAGE_GROUNDS={paper:"var(--c50)",white:"var(--c0)",grey:"var(--c500)",ink:"var(--c950)"};
  function applyStageBg(){
    var v=els.stageGround.value;
    $("stageGroundCustomRow").style.display=(v==="custom")?"":"none";
    $("stage").style.background=(v==="custom")?els.stageGroundColor.value:STAGE_GROUNDS[v];
  }
  els.stageGround.addEventListener("input",applyStageBg);
  els.stageGroundColor.addEventListener("input",applyStageBg);

  /* THE READOUTS, AND THE SLIDERS' OWN FILL.
     controls.css's .ctl--range draws its filled portion from --ctl-range-value,
     a 0..1 number, because no shipping engine exposes a range's value to CSS:
     ::-moz-range-progress is Gecko-only and ::slider-fill needs appearance:base,
     which Chrome 151 does not support. THE HOOK IS THIS FUNCTION AND NOT A NEW
     LISTENER, and that is the whole reason this is safe -- syncOutputs() is
     already the single place the panel re-reads its own state, called from every
     input handler, from loadPreset, loadSaved, loadNodeSliders, randomizeAll,
     the shape handler and init. A fill written anywhere else would go stale the
     first time a preset moved a slider without the user touching it. */
  function fillRanges(){
    [].forEach.call(document.querySelectorAll(".ctl--range"),function(r){
      var lo=(r.min==="")?0:parseFloat(r.min),
          hi=(r.max==="")?100:parseFloat(r.max),
          v=parseFloat(r.value);
      r.style.setProperty("--ctl-range-value",
        (isFinite(lo)&&isFinite(hi)&&isFinite(v)&&hi>lo)?((v-lo)/(hi-lo)).toFixed(4):"0");
    });
  }
  function syncOutputs(){
    rangeIds.concat(nodeRangeIds).forEach(function(k){
      var o=$(k+"O");if(o)o.textContent=els[k].value;});
    fillRanges();
  }
  /* WHICH WELL THE OTHER TAB IS EDITING. .ctl--swatch's selected ring is the one
     state a colour well cannot show in its own ground, because the ground is the
     visitor's. Look holds the five colours and Nodes edits one node at a time, so
     the selection already exists -- it just had no way to be seen from the tab
     where the colours are. This is a read-only mark, not a second control: the
     authoritative picker stays the <select>, and clicking a well still does the
     one thing a colour well does. */
  function markSelectedSwatch(){
    var i=+els.nodeSel.value;
    colorIds.forEach(function(id,j){
      els[id].setAttribute("data-selected",(j===i)?"true":"false");});
  }

  function loadPreset(i){
    var p=PRESETS[i];if(!p)return;
    loadingPreset=true;
    colorIds.forEach(function(id,j){els[id].value=p.colors[j];});
    nodes=p.nodes.map(function(nd){return{x:nd.x,y:nd.y,size:nd.size,len:nd.len,ang:nd.ang};});
    els.form.value=String(p.form||0);
    els.contour.value=(p.contour!==undefined)?p.contour:18;
    els.tension.value=(p.tension!==undefined)?p.tension:40;
    els.rim.value=(p.rim!==undefined)?p.rim:((p.form||0)===0?35:0);
    els.layer.value=(p.layer!==undefined)?p.layer:55;
    els.shape.value=p.shape?p.shape:(((p.form||0)===0)?"orb":"bleed");
    ["lx","ly","glow","flow","melt","wob","bend","foldA","foldSh","edgeF","glass","sweep","expo","fringe","haloA","vol","grain"]
      .forEach(function(k){if(p[k]!==undefined)els[k].value=p[k];});
    loadNodeSliders();syncOutputs();apply();
    loadingPreset=false;
  }

  function writeCode(v,orb,haloA){
    var engine=window.FluidMesh.toString();
    var conf={colors:v.colors,
      nodes:nodes.map(function(nd){return{x:+nd.x.toFixed(3),y:+nd.y.toFixed(3),
        size:+nd.size.toFixed(2),len:+nd.len.toFixed(3),ang:+nd.ang.toFixed(3)};}),
      light:v.light,glow:v.glow,melt:v.melt,sweep:v.sweep,flow:v.flow,
      grain:v.grain,fringe:v.fringe,expo:v.expo,orb:v.orb,
      wob:v.wob,edgeF:v.edgeF,glass:v.glass,
      form:v.form,sph:v.sph,orb:v.orb,bend:v.bend,foldA:v.foldA,foldSh:v.foldSh,contour:v.contour};
    var fallback=".fmFallback{background:"+fallbackHalo(v,0.9)+"}";
    var lines=["<!-- Fluid Mesh — generated by Gradient Maker -->"];
    if(orb){
      lines.push("<!-- Duo/Trio scenes are a stage-preview feature; this snippet exports the solo orb -->");
      lines.push(
'<div class="fmOrb">',
'  <div class="fmHaloWrap"><div class="fmHalo"><canvas class="fmHaloCanvas"></canvas></div></div>',
'  <div class="fmClip"><canvas class="fmCanvas"></canvas></div>',
'</div>',
"<style>",
".fmOrb{position:relative;aspect-ratio:1;--R:215px} /* set --R to half your orb width */",
".fmHaloWrap{position:absolute;inset:-26%;pointer-events:none;mix-blend-mode:multiply}",
".fmHalo{position:absolute;inset:0;border-radius:50%;overflow:hidden;",
"  filter:blur(calc(var(--R)*0.34));opacity:"+haloA.toFixed(2)+"}",
".fmHalo canvas{position:absolute;inset:-8%;width:116%;height:116%;display:block}",
".fmClip{position:absolute;inset:0;border-radius:50%;overflow:hidden;",
"  isolation:isolate;transform:translateZ(0)}",
".fmClip::after{content:\"\";position:absolute;inset:0;border-radius:50%;",
"  pointer-events:none;z-index:2;box-shadow:"+volShadow(v)+"}",
".fmCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}",
fallback,
"</style>");
    }else{
      lines.push(
'<div class="fmBg"><canvas class="fmCanvas"></canvas></div>',
"<style>",
".fmBg{position:absolute;inset:0;overflow:hidden} /* or fixed, for a page background */",
".fmCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}",
fallback,
"</style>");
    }
    lines.push("<script>");
    lines.push(engine.trim());
    var init="var fmCfg="+JSON.stringify(conf)+";";
    if(orb)init+="fmCfg.haloCanvas=document.querySelector('.fmHaloCanvas');";
    lines.push(init);
    lines.push("var fm=FluidMesh(document.querySelector('.fmCanvas'),fmCfg);");
    lines.push("if(!fm)document.querySelector('.fmCanvas').parentNode.classList.add('fmFallback');");
    lines.push("<\/script>");
    $("code").textContent=lines.join("\n");
  }

  /* Randomize draws from ARCHETYPES, not uniform ranges: each defines the five
     nodes' ROLES (crown light, two mid masses, one deep, one small accent) with
     locked lightness/saturation relationships — the reason random pulls stay
     pretty. Composition rules: one diagonal band, one accent near a limb, light
     in the upper third, coherent angles. */
  function rnd(a,b){return a+Math.random()*(b-a);}
  var ARCH=[
    {n:"glacier",h:function(h){return[h,h+18,h+34,h+46,h+rnd(150,190)];},
     S:[30,62,78,82,55],L:[93,72,55,38,82],expo:[96,106]},
    {n:"sunset",h:function(h){return[h+16,h,h-18,h+rnd(215,250),h+30];},
     S:[55,88,90,80,60],L:[84,58,48,40,82],expo:[92,102]},
    {n:"orchid",h:function(h){return[h+24,h,h-20,h-38,h+45];},
     S:[35,72,85,85,50],L:[90,66,52,36,84],expo:[94,104]},
    {n:"forest",h:function(h){return[h+30,h+rnd(60,90),h,h-16,h+rnd(140,170)];},
     S:[28,80,68,72,75],L:[90,62,48,32,66],expo:[92,102]},
    {n:"noir",h:function(h){return[h,h+16,h-14,h+8,h+rnd(120,160)];},
     S:[45,55,60,50,85],L:[24,16,30,12,58],expo:[58,72]}
  ];
  var lastArch=-1;
  function pickArch(){
    var i;do{i=Math.floor(Math.random()*ARCH.length);}while(i===lastArch&&ARCH.length>1);
    lastArch=i;return ARCH[i];
  }
  function applyArchColors(a){
    var h=rnd(0,360),hues=a.h(h);
    colorIds.forEach(function(id,j){
      els[id].value=hslToHex(hues[j]+rnd(-6,6),a.S[j]+rnd(-8,8),a.L[j]+rnd(-4,4));});
    return a;
  }
  function randomColors(){
    applyArchColors(pickArch());
    markCustom();apply();
  }
  function randomizeAll(){
    var a=applyArchColors(pickArch());
    var bandAng=rnd(-45,-22);            /* one coherent diagonal family */
    var accSide=Math.random()<.5?rnd(.08,.2):rnd(.8,.92);
    nodes=[
      N(rnd(.42,.58),rnd(.18,.32),rnd(1.0,1.4),rnd(0,.08),bandAng+rnd(-10,10)),
      N(rnd(.24,.44),rnd(.40,.60),rnd(.8,1.15),rnd(.04,.14),bandAng+rnd(-8,8)),
      N(rnd(.40,.62),rnd(.55,.72),rnd(.8,1.1),rnd(.18,.30),bandAng),
      N(rnd(.56,.80),rnd(.66,.86),rnd(.7,1.05),rnd(.06,.18),bandAng+rnd(-8,8)),
      N(accSide,rnd(.30,.62),rnd(.28,.5),rnd(0,.12),bandAng+rnd(-12,12))];
    els.lx.value=Math.round(rnd(30,58));els.ly.value=Math.round(rnd(14,32));
    els.glow.value=Math.round(rnd(35,58));
    els.melt.value=Math.round(rnd(46,62));
    els.wob.value=Math.round(rnd(4,16));
    els.edgeF.value=Math.round(rnd(24,48));
    els.glass.value=Math.round(rnd(28,55));
    els.sweep.value=Math.round(rnd(22,42));
    els.fringe.value=Math.round(rnd(12,50));
    els.expo.value=Math.round(rnd(a.expo[0],a.expo[1]));
    loadNodeSliders();syncOutputs();markCustom();apply();
  }

  /* the copy control is a 44px icon button now, so its confirmation is the glyph
     rather than the label -- same 1400ms, same idea, and the aria-label goes with
     it so a screen reader hears the change too */
  var COPY_ICO=$("copyBtn").innerHTML;
  var COPY_OK='<svg class="gIco" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5l10 -10"/></svg>';
  $("copyBtn").addEventListener("click",function(){
    var txt=$("code").textContent,btn=this,lbl=btn.getAttribute("aria-label");
    function ok(){btn.innerHTML=COPY_OK;btn.classList.add("is-ok");
      btn.setAttribute("aria-label","Embed code copied");
      setTimeout(function(){btn.innerHTML=COPY_ICO;btn.classList.remove("is-ok");
        btn.setAttribute("aria-label",lbl);},1400);}
    function fallback(){var ta=document.createElement("textarea");ta.value=txt;
      document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");ok();}catch(e){}
      document.body.removeChild(ta);}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok,fallback);
    }else fallback();
  });

  colorIds.concat(rangeIds).forEach(function(k){
    els[k].addEventListener("input",function(){syncOutputs();markCustom();apply();});
  });
  nodeRangeIds.forEach(function(k){
    els[k].addEventListener("input",function(){saveNodeSliders();syncOutputs();markCustom();apply();});
  });
  els.nodeSel.addEventListener("input",loadNodeSliders);
  els.form.addEventListener("input",function(){markCustom();apply();});
  els.shape.addEventListener("input",function(){
    /* Orb brings its dressing: a field authored full-bleed carries no halo,
       rim or feather, so becoming a planet would render a flat disc */
    if(els.shape.value==="orb"&&(+els.edgeF.value+ +els.haloA.value+ +els.rim.value)===0){
      els.edgeF.value=34;els.haloA.value=50;els.rim.value=35;els.vol.value=45;
      syncOutputs();
    }
    markCustom();apply();});
  $("scene").addEventListener("input",apply);

  /* ---- saved presets: the full state, persisted, listed under the built-ins ---- */
  var LS_KEY="glabPresets";
  function savedList(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"[]");}catch(e){return[];}}
  function serialize(){
    var s={colors:colorIds.map(function(id){return els[id].value;}),
      nodes:nodes.map(function(nd){return{x:nd.x,y:nd.y,size:nd.size,len:nd.len,ang:nd.ang};}),
      form:els.form.value,sliders:{}};
    rangeIds.forEach(function(k){s.sliders[k]=els[k].value;});
    return s;
  }
  function rebuildSavedOptions(){
    [].slice.call(els.preset.querySelectorAll("option[data-saved]"))
      .forEach(function(o){o.remove();});
    savedList().forEach(function(p,i){
      var o=document.createElement("option");
      o.value="s"+i;o.textContent="★ "+p.name;o.setAttribute("data-saved","1");
      els.preset.appendChild(o);
    });
  }
  function loadSaved(i){
    var p=savedList()[i];if(!p)return;
    loadingPreset=true;
    var s=p.s;
    colorIds.forEach(function(id,j){els[id].value=s.colors[j];});
    nodes=s.nodes.map(function(nd){return{x:nd.x,y:nd.y,size:nd.size,len:nd.len,ang:nd.ang};});
    els.form.value=s.form;
    rangeIds.forEach(function(k){if(s.sliders[k]!==undefined)els[k].value=s.sliders[k];});
    loadNodeSliders();syncOutputs();apply();
    loadingPreset=false;
  }
  $("saveBtn").addEventListener("click",function(){
    var arr=savedList();
    arr.push({name:"My preset "+(arr.length+1),s:serialize()});
    try{localStorage.setItem(LS_KEY,JSON.stringify(arr));}catch(e){}
    rebuildSavedOptions();
    els.preset.value="s"+(arr.length-1);
  });
  rebuildSavedOptions();

  els.preset.addEventListener("input",function(){
    var v=els.preset.value;
    if(v.charAt(0)==="s"){loadSaved(+v.slice(1));return;}
    var i=+v;if(i>=0)loadPreset(i);
  });
  $("rnd").addEventListener("click",randomizeAll);
  $("rndColors").addEventListener("click",randomColors);

  /* hi-res PNG: 2048 square for the planet (with feathered alpha), 2x the
     stage for full-bleed forms, capped at 4096 on the long edge */
  $("pngBtn").addEventListener("click",function(){
    if(!mesh)return;
    var v=cfg(),w,h;
    if(v.form===0){w=h=2048;}
    else{var st=$("stage");var sc=Math.min(2,4096/Math.max(st.clientWidth,st.clientHeight));
      w=Math.round(st.clientWidth*sc);h=Math.round(st.clientHeight*sc);}
    var cv2=mesh.snapshot(w,h);
    if(!cv2)return;
    var nm=els.preset.value>=0?els.preset.options[els.preset.selectedIndex].text:"custom";
    cv2.toBlob(function(b){
      if(!b)return;
      var a=document.createElement("a");
      a.href=URL.createObjectURL(b);
      a.download="gradient-"+nm.toLowerCase().replace(/[^a-z0-9]+/g,"-")+".png";
      a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
    });
  });

  /* ---- the tab strip. One group visible at a time is what lets thirty controls
     live in a panel that never scrolls; it is a reduction of what is on screen,
     not a scrollport. Roving tabindex + arrow keys per the ARIA tabs pattern:
     one Tab stop for the whole strip, arrows to move within it. ---- */
  var tabs=[].slice.call(document.querySelectorAll(".ctl--tab"));
  function selectTab(el){
    tabs.forEach(function(t){
      var on=(t===el);
      t.setAttribute("aria-selected",on?"true":"false");
      t.tabIndex=on?0:-1;
      $(t.getAttribute("aria-controls")).hidden=!on;
    });
  }
  tabs.forEach(function(t,i){
    t.addEventListener("click",function(){selectTab(t);});
    t.addEventListener("keydown",function(e){
      var d=(e.key==="ArrowRight")?1:(e.key==="ArrowLeft")?-1:
            (e.key==="Home")?-i:(e.key==="End")?(tabs.length-1-i):0;
      if(!d&&e.key!=="Home"&&e.key!=="End")return;
      e.preventDefault();
      var n=tabs[(i+d+tabs.length)%tabs.length];
      selectTab(n);n.focus();
    });
  });

  function sizeR(){var w=$("orbWrap").getBoundingClientRect().width;
    $("orbWrap").style.setProperty("--R",(w/2).toFixed(0)+"px");}
  addEventListener("resize",sizeR);

  sizeR();loadNodeSliders();syncOutputs();apply();applyStageBg();
})();
</script>
</body>
</html>
