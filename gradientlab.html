<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Gradient Lab — Jayden Betts</title>
<style>
  @font-face{font-family:"Instrument Sans";src:url("fonts/instrument-sans-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Instrument Sans";src:url("fonts/instrument-sans-latin-600-normal.woff2") format("woff2");font-weight:600;font-display:swap}

  :root{
    --paper:#f8f9fa; --ink:#232323; --sub:#75756e; --hair:#e7e6e1;
    --panel:rgba(255,255,255,.72); --accent:#0E6B3B;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Instrument Sans",-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.5}

  header{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;
    align-items:center;padding:18px 26px;pointer-events:none}
  header b{font-weight:600;letter-spacing:.02em}
  header span{color:var(--sub);font-size:12px;letter-spacing:.12em;text-transform:uppercase}

  .lab{display:grid;grid-template-columns:1fr 320px;min-height:100vh}
  @media(max-width:880px){.lab{grid-template-columns:1fr}.panel{position:static;max-height:none;margin:0 16px 26px}}

  /* ============ THE STAGE ============
     One WebGL canvas is the fluid field. Orb mode clips it into the circle and
     dresses it (halo behind, volume insets above). Canvas mode lets the same
     field fill the stage as a background. The engine itself lives in the
     #fluidEngine script tag so the export can emit it VERBATIM. */
  .stage{position:relative;display:flex;align-items:center;justify-content:center;
    min-height:72vh;padding:80px 30px 40px}
  .stage.bgMode{padding:0}
  .bgHost{position:absolute;inset:0;display:none;overflow:hidden}
  .stage.bgMode .bgHost{display:block}
  .stage.bgMode .orbWrap{display:none}
  .orbWrap{position:relative;width:min(430px,78vw);aspect-ratio:1;--R:215px}
  .haloWrap{position:absolute;inset:-26%;pointer-events:none;mix-blend-mode:multiply}
  .halo{position:absolute;inset:0;border-radius:50%;filter:blur(calc(var(--R)*0.37))}
  .discClip{position:absolute;inset:0;border-radius:50%;overflow:hidden;
    isolation:isolate;transform:translateZ(0)}
  .discClip::after{content:"";position:absolute;inset:0;border-radius:50%;
    pointer-events:none;z-index:2;box-shadow:var(--volSh,none)}
  .discClip canvas,.bgHost canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------------- panel ---------------- */
  .panel{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;
    margin:74px 22px 26px 0;padding:20px 20px 16px;border-radius:16px;
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--hair);box-shadow:0 1px 2px rgba(20,20,16,.04),0 18px 44px rgba(20,20,16,.07);z-index:6}
  .sec{padding:14px 0 16px;border-bottom:1px solid var(--hair)}
  .sec:first-child{padding-top:2px}
  .sec:last-of-type{border-bottom:0}
  .secH{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--sub);margin:0 0 12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}
  .row label{color:var(--ink);font-size:13px;white-space:nowrap}
  .row output{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}

  input[type=color]{appearance:none;-webkit-appearance:none;width:30px;height:30px;border:1px solid var(--hair);
    border-radius:50%;padding:0;background:none;cursor:pointer;overflow:hidden}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
  .swRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .swRow .sw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}

  input[type=range]{appearance:none;-webkit-appearance:none;flex:1;height:2px;border-radius:1px;
    background:var(--hair);cursor:pointer}
  input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:#fff;border:1px solid #d5d4cd;
    box-shadow:0 1px 3px rgba(20,20,16,.18)}
  input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

  .check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
  .check input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}

  button{font-family:inherit;cursor:pointer}
  .btn{width:100%;border:0;border-radius:8px;padding:11px 14px;font-size:13px;font-weight:600;
    background:var(--ink);color:#fbfbf8;letter-spacing:.02em}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible,.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .codeBox{position:relative;margin-top:10px}
  pre{margin:0;max-height:190px;overflow:auto;padding:12px;border-radius:8px;
    background:#fff;border:1px solid var(--hair);font-size:10.5px;line-height:1.55;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#3c3b36;white-space:pre;tab-size:2}
  .copy{position:absolute;top:8px;right:8px;border:1px solid var(--hair);background:rgba(255,255,255,.92);
    border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;color:var(--ink)}
  .copy.ok{color:var(--accent);border-color:var(--accent)}
  .glErr{display:none;color:#8a3030;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<header><b>Gradient Lab</b><span>fluid mesh system</span></header>

<div class="lab">
  <main class="stage" id="stage">
    <div class="bgHost" id="bgHost"></div>
    <div class="orbWrap" id="orbWrap">
      <div class="haloWrap"><div class="halo" id="halo"></div></div>
      <div class="discClip" id="discClip"><canvas id="fluid"></canvas></div>
    </div>
  </main>

  <aside class="panel" aria-label="Controls">
    <div class="sec">
      <p class="secH">Palette — five nodes</p>
      <div class="swRow">
        <span class="sw"><input type="color" id="c1" value="#f2a03d" aria-label="Node one">1</span>
        <span class="sw"><input type="color" id="c2" value="#e2472e" aria-label="Node two">2</span>
        <span class="sw"><input type="color" id="c3" value="#c2378f" aria-label="Node three">3</span>
        <span class="sw"><input type="color" id="c4" value="#6d34e8" aria-label="Node four">4</span>
        <span class="sw"><input type="color" id="c5" value="#ffd9a0" aria-label="Node five">5</span>
      </div>
    </div>

    <div class="sec">
      <p class="secH">Field</p>
      <div class="row"><label for="flow">Flow</label><input type="range" id="flow" min="0" max="100" value="42"><output id="flowO">42</output></div>
      <div class="row"><label for="warp">Warp</label><input type="range" id="warp" min="0" max="100" value="48"><output id="warpO">48</output></div>
      <div class="row"><label for="scale">Scale</label><input type="range" id="scale" min="0" max="100" value="26"><output id="scaleO">26</output></div>
    </div>

    <div class="sec">
      <p class="secH">Light</p>
      <div class="row"><label for="lx">Light X</label><input type="range" id="lx" min="0" max="100" value="36"><output id="lxO">36</output></div>
      <div class="row"><label for="ly">Light Y</label><input type="range" id="ly" min="0" max="100" value="30"><output id="lyO">30</output></div>
      <div class="row"><label for="glow">Glow</label><input type="range" id="glow" min="0" max="100" value="55"><output id="glowO">55</output></div>
    </div>

    <div class="sec">
      <p class="secH">Orb dressing</p>
      <div class="row"><label class="check"><input type="checkbox" id="orbMode" checked>Orb mode (off = background)</label></div>
      <div class="row"><label for="haloA">Halo</label><input type="range" id="haloA" min="0" max="70" value="36"><output id="haloAO">36</output></div>
      <div class="row"><label for="vol">Volume</label><input type="range" id="vol" min="0" max="100" value="50"><output id="volO">50</output></div>
      <div class="row"><label for="grain">Grain</label><input type="range" id="grain" min="0" max="100" value="16"><output id="grainO">16</output></div>
    </div>

    <div class="sec">
      <button class="btn" id="rnd" type="button">Randomize</button>
      <p class="glErr" id="glErr">WebGL unavailable — showing nothing. The export still includes a static CSS fallback.</p>
    </div>

    <div class="sec">
      <p class="secH">Export</p>
      <div class="codeBox">
        <pre id="code" tabindex="0"></pre>
        <button class="copy" id="copyBtn" type="button">Copy</button>
      </div>
    </div>
  </aside>
</div>

<script id="fluidEngine">
/* FluidMesh — a no-dependency WebGL fluid mesh gradient.
   Per-pixel value-noise layers sharpened with pow() (the Stripe-mesh move: the
   exponent thresholds noise into distinct swooping bands), domain-warped
   (Quilez f(p+f(p))), colours MIXED IN OKLAB so complementary hues never grey
   out, plus a light point that brightens AND locally rotates hue — the volume
   spots. Ships with DPR capping, hidden-tab pause, reduced-motion still frame,
   context-loss recovery, and 1/255 dither against banding.
   new FluidMesh(canvas, cfg) -> {set(cfg), destroy()}
   cfg: {colors:[5x'#hex'], nodes:[5x[x,y]], light:[x,y], glow,warp,scale,flow,
         grain, sharp} (all 0..1 except sharp ~4) */
function FluidMesh(canvas,cfg){
  "use strict";
  var VS="attribute vec2 aP;void main(){gl_Position=vec4(aP,0.,1.);}";
  var FS=""+
"precision highp float;\n"+
"uniform vec2 uRes;uniform float uTime;\n"+
"uniform float uWarp,uScale,uGlow,uGrain,uSharp;\n"+
"uniform vec2 uLight;uniform vec3 uCol[5];uniform vec2 uPos[5];\n"+
"float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}\n"+
"float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);\n"+
" float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.));\n"+
" return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}\n"+
"float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*vnoise(p);p*=2.03;a*=.5;}return v;}\n"+
"vec3 srgb2ok(vec3 c){c=pow(max(c,0.),vec3(2.2));\n"+
" float l=dot(c,vec3(.4122214708,.5363325363,.0514459929));\n"+
" float m=dot(c,vec3(.2119034982,.6806995451,.1073969566));\n"+
" float s=dot(c,vec3(.0883024619,.2817188376,.6299787005));\n"+
" l=pow(l,1./3.);m=pow(m,1./3.);s=pow(s,1./3.);\n"+
" return vec3(.2104542553*l+.7936177850*m-.0040720468*s,\n"+
"  1.9779984951*l-2.4285922050*m+.4505937099*s,\n"+
"  .0259040371*l+.7827717662*m-.8086757660*s);}\n"+
"vec3 ok2srgb(vec3 c){\n"+
" float l=c.x+.3963377774*c.y+.2158037573*c.z;\n"+
" float m=c.x-.1055613458*c.y-.0638541728*c.z;\n"+
" float s=c.x-.0894841775*c.y-1.2914855480*c.z;\n"+
" l=l*l*l;m=m*m*m;s=s*s*s;\n"+
" vec3 r=vec3(4.0767416621*l-3.3077115913*m+.2309699292*s,\n"+
"  -1.2684380046*l+2.6097574011*m-.3413193965*s,\n"+
"  -.0041960863*l-.7034186147*m+1.7076147010*s);\n"+
" return pow(max(r,0.),vec3(1./2.2));}\n"+
"void main(){\n"+
" float aspect=uRes.x/uRes.y;\n"+
" vec2 uv=gl_FragCoord.xy/uRes;\n"+
" vec2 uvA=vec2((uv.x-.5)*aspect+.5,uv.y);\n"+
" float sc=mix(.9,3.2,uScale);\n"+
" vec2 q=uvA*sc;\n"+
" /* domain warp: two fbm reads displace the sample point — the swoop */\n"+
" vec2 w=vec2(fbm(q+uTime*.30),fbm(q+vec2(5.2,1.3)-uTime*.24));\n"+
" vec2 p=q+(w-.5)*mix(0.,1.6,uWarp);\n"+
" vec3 col=srgb2ok(uCol[0]);\n"+
" for(int i=1;i<5;i++){\n"+
"  vec2 anchor=vec2((uPos[i].x-.5)*aspect+.5,uPos[i].y);\n"+
"  float n=fbm(p+uPos[i]*7.31+uTime*(.18+.07*float(i)));\n"+
"  float m=pow(clamp(n*1.35-.12,0.,1.),uSharp);\n"+
"  float g=exp(-1.7*distance(uvA,anchor));\n"+
"  col=mix(col,srgb2ok(uCol[i]),clamp(m*g*2.7,0.,1.));\n"+
" }\n"+
" /* the light: brighten toward warm white AND rotate hue locally — the strange\n"+
"    colour spots of a lit sphere, not a flat spotlight */\n"+
" vec2 lp=vec2((uLight.x-.5)*aspect+.5,uLight.y);\n"+
" float ld=distance(uvA,lp);\n"+
" float lw=smoothstep(.62,.04,ld)*uGlow;\n"+
" float ang=lw*1.35;\n"+
" float ca=cos(ang),sa=sin(ang);\n"+
" col.yz=mat2(ca,-sa,sa,ca)*col.yz;\n"+
" col.x+=lw*.30;col.yz*=(1.-.35*lw);\n"+
" vec3 rgb=ok2srgb(col);\n"+
" /* dither (always) + film grain (dialable) */\n"+
" float n2=hash(gl_FragCoord.xy+fract(uTime)*61.7);\n"+
" rgb+=(n2-.5)*(1.5/255.)+(n2-.5)*uGrain*.10;\n"+
" gl_FragColor=vec4(rgb,1.);\n"+
"}";
  var gl=canvas.getContext("webgl",{antialias:true,alpha:false})||
         canvas.getContext("experimental-webgl");
  if(!gl)return null;
  var prog,raf=0,t=0,last=0,dead=false,lost=false;
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
  function setup(){
    prog=gl.createProgram();
    gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));
    gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
    gl.linkProgram(prog);gl.useProgram(prog);
    var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    var loc=gl.getAttribLocation(prog,"aP");
    gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  }
  function hex2rgb(h){var n=parseInt(h.slice(1),16);
    return[((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255];}
  function uniforms(){
    var u=function(n){return gl.getUniformLocation(prog,n);};
    gl.uniform2f(u("uRes"),canvas.width,canvas.height);
    gl.uniform1f(u("uWarp"),cfg.warp);gl.uniform1f(u("uScale"),cfg.scale);
    gl.uniform1f(u("uGlow"),cfg.glow);gl.uniform1f(u("uGrain"),cfg.grain);
    gl.uniform1f(u("uSharp"),cfg.sharp||4.0);
    gl.uniform2f(u("uLight"),cfg.light[0],1.-cfg.light[1]);
    for(var i=0;i<5;i++){
      var c=hex2rgb(cfg.colors[i]);
      gl.uniform3f(u("uCol["+i+"]"),c[0],c[1],c[2]);
      var p=cfg.nodes[i]||[.5,.5];
      gl.uniform2f(u("uPos["+i+"]"),p[0],1.-p[1]);
    }
  }
  function size(){
    var dpr=Math.min(window.devicePixelRatio||1,1.75);
    var w=canvas.clientWidth,h=canvas.clientHeight;
    if(!w||!h)return;
    var W=Math.round(w*dpr),H=Math.round(h*dpr);
    if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;
      gl.viewport(0,0,W,H);}
  }
  function frame(now){
    raf=0;
    if(dead||lost)return;
    size();
    var dt=last?Math.min(.05,(now-last)/1000):0;last=now;
    t+=dt*(0.05+cfg.flow*0.35);
    gl.useProgram(prog);uniforms();
    gl.uniform1f(gl.getUniformLocation(prog,"uTime"),t);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(!reduce&&cfg.flow>0&&!document.hidden)raf=requestAnimationFrame(frame);
  }
  function kick(){if(!raf&&!dead&&!lost){last=0;raf=requestAnimationFrame(frame);}}
  canvas.addEventListener("webglcontextlost",function(e){e.preventDefault();lost=true;},false);
  canvas.addEventListener("webglcontextrestored",function(){lost=false;setup();kick();},false);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)kick();});
  window.addEventListener("resize",kick);
  setup();kick();
  return{
    set:function(next){for(var k in next)cfg[k]=next[k];kick();},
    destroy:function(){dead=true;if(raf)cancelAnimationFrame(raf);},
    canvas:canvas
  };
}
</script>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var colorIds=["c1","c2","c3","c4","c5"];
  var rangeIds=["flow","warp","scale","lx","ly","glow","haloA","vol","grain"];
  var els={};colorIds.concat(rangeIds).forEach(function(k){els[k]=$(k);});
  els.orbMode=$("orbMode");

  var nodes=[[.5,.5],[.24,.30],[.72,.42],[.70,.78],[.30,.68]];

  function hexToHsl(hex){
    var n=parseInt(hex.slice(1),16),r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255;
    var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2,d=mx-mn;
    if(d){s=l>0.5?d/(2-mx-mn):d/(mx+mn);
      h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60;}
    return{h:h,s:s*100,l:l*100};
  }
  function hsl(h,s,l,a){h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s));l=Math.max(0,Math.min(100,l));
    return "hsl("+h.toFixed(0)+" "+s.toFixed(0)+"% "+l.toFixed(0)+"% / "+a+")";}
  function hslToHex(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;
    var f=function(n){var k=(n+h/30)%12,c=s*Math.min(l,1-l);
      var v=l-c*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));
      return Math.round(v*255).toString(16).padStart(2,"0");};
    return "#"+f(0)+f(8)+f(4);
  }

  function cfg(){
    return{
      colors:colorIds.map(function(id){return els[id].value;}),
      nodes:nodes,
      light:[+els.lx.value/100,+els.ly.value/100],
      glow:+els.glow.value/100, warp:+els.warp.value/100,
      scale:+els.scale.value/100, flow:+els.flow.value/100,
      grain:+els.grain.value/100, sharp:4.0
    };
  }

  var mesh=FluidMesh($("fluid"),cfg());
  if(!mesh)$("glErr").style.display="block";

  function dressing(v){
    var A=hexToHsl(v.colors[0]),C=hexToHsl(v.colors[3]);
    var haloA=+els.haloA.value/100, vol=+els.vol.value/100;
    var ux=(v.light[0]*100-50)/50, uy=(v.light[1]*100-50)/50;
    var halo="radial-gradient(42% 42% at 32% 26%, "+hsl(A.h,A.s,70,(0.9*haloA).toFixed(2))+", transparent 70%),"
      +"radial-gradient(46% 46% at 74% 58%, "+hsl(C.h,C.s,68,(0.8*haloA).toFixed(2))+", transparent 72%),"
      +"radial-gradient(60% 60% at 50% 55%, "+hsl(hexToHsl(v.colors[1]).h,80,60,(0.5*haloA).toFixed(2))+", transparent 74%)";
    var volSh="inset calc(var(--R)*"+(ux*0.12).toFixed(3)+") calc(var(--R)*"+(uy*0.12).toFixed(3)
      +") calc(var(--R)*0.19) 0 "+hsl(C.h,75,14,(0.5*vol).toFixed(2))
      +",inset calc(var(--R)*"+(-ux*0.08).toFixed(3)+") calc(var(--R)*"+(-uy*0.08).toFixed(3)
      +") calc(var(--R)*0.13) 0 "+hsl(A.h,50,96,(0.55*vol).toFixed(2));
    return{halo:halo,volSh:volSh};
  }

  function apply(){
    var v=cfg();
    if(mesh)mesh.set(v);
    var d=dressing(v);
    $("halo").style.background=d.halo;
    $("discClip").style.setProperty("--volSh",d.volSh);
    var orb=els.orbMode.checked;
    $("stage").classList.toggle("bgMode",!orb);
    var canvas=$("fluid");
    var host=orb?$("discClip"):$("bgHost");
    if(canvas.parentNode!==host)host.insertBefore(canvas,host.firstChild);
    writeCode(v,d,orb);
  }
  function syncOutputs(){
    rangeIds.forEach(function(k){var o=$(k+"O");if(o)o.textContent=els[k].value;});
  }

  function writeCode(v,d,orb){
    var engine=document.getElementById("fluidEngine").textContent;
    var conf=JSON.stringify({colors:v.colors,nodes:v.nodes,light:v.light,glow:v.glow,
      warp:v.warp,scale:v.scale,flow:v.flow,grain:v.grain,sharp:4},null,1);
    var fallback=".fluidFallback{background:"
      +"radial-gradient(70% 70% at 32% 28%, "+v.colors[0]+", transparent 70%),"
      +"radial-gradient(70% 70% at 72% 46%, "+v.colors[1]+", transparent 72%),"
      +"radial-gradient(80% 80% at 60% 78%, "+v.colors[3]+", "+v.colors[2]+" 60%,transparent 85%)}";
    var lines=[];
    lines.push("<!-- Fluid Mesh — generated by Gradient Lab -->");
    if(orb){
      lines.push(
'<div class="fmOrb">',
'  <div class="fmHaloWrap"><div class="fmHalo"></div></div>',
'  <div class="fmClip"><canvas class="fmCanvas"></canvas></div>',
'</div>',
"<style>",
".fmOrb{position:relative;aspect-ratio:1;--R:215px} /* set --R to half your orb width */",
".fmHaloWrap{position:absolute;inset:-26%;pointer-events:none;mix-blend-mode:multiply}",
".fmHalo{position:absolute;inset:0;border-radius:50%;filter:blur(calc(var(--R)*0.37));",
"  background:"+d.halo+"}",
".fmClip{position:absolute;inset:0;border-radius:50%;overflow:hidden;",
"  isolation:isolate;transform:translateZ(0)}",
".fmClip::after{content:\"\";position:absolute;inset:0;border-radius:50%;",
"  pointer-events:none;z-index:2;box-shadow:"+d.volSh+"}",
".fmCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}",
fallback,
"</style>");
    }else{
      lines.push(
'<div class="fmBg"><canvas class="fmCanvas"></canvas></div>',
"<style>",
".fmBg{position:absolute;inset:0;overflow:hidden} /* or fixed, for a page background */",
".fmCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}",
fallback,
"</style>");
    }
    lines.push("<script>");
    lines.push(engine.trim());
    lines.push("var fm=FluidMesh(document.querySelector('.fmCanvas'),"+conf+");");
    lines.push("if(!fm)document.querySelector('.fmCanvas').parentNode.classList.add('fluidFallback');");
    lines.push("<\/script>");
    $("code").textContent=lines.join("\n");
  }

  /* randomize: 5-node palettes — 3 analogous + 1 counter + 1 cream lift,
     plus fresh node scatter and light */
  function rnd(a,b){return a+Math.random()*(b-a);}
  function randomize(){
    var h=rnd(0,360);
    var hues=[h, h+rnd(14,34), h+rnd(-26,-12), h+rnd(140,220), h+rnd(30,60)];
    els.c1.value=hslToHex(hues[0],rnd(70,92),rnd(52,62));
    els.c2.value=hslToHex(hues[1],rnd(72,95),rnd(46,56));
    els.c3.value=hslToHex(hues[2],rnd(65,90),rnd(44,56));
    els.c4.value=hslToHex(hues[3],rnd(60,92),rnd(38,55));
    els.c5.value=hslToHex(hues[4],rnd(45,70),rnd(76,88));
    els.lx.value=Math.round(rnd(22,48));els.ly.value=Math.round(rnd(18,40));
    nodes=[[.5,.5],
      [rnd(.14,.38),rnd(.18,.42)],
      [rnd(.58,.84),rnd(.28,.52)],
      [rnd(.56,.84),rnd(.62,.88)],
      [rnd(.16,.42),rnd(.56,.84)]];
    syncOutputs();apply();
  }

  $("copyBtn").addEventListener("click",function(){
    var txt=$("code").textContent,btn=this;
    function ok(){btn.textContent="Copied ✓";btn.classList.add("ok");
      setTimeout(function(){btn.textContent="Copy";btn.classList.remove("ok");},1400);}
    function fallback(){var ta=document.createElement("textarea");ta.value=txt;
      document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");ok();}catch(e){}
      document.body.removeChild(ta);}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok,fallback);
    }else fallback();
  });

  colorIds.concat(rangeIds).forEach(function(k){
    els[k].addEventListener("input",function(){syncOutputs();apply();});
  });
  els.orbMode.addEventListener("input",apply);
  $("rnd").addEventListener("click",randomize);

  function sizeR(){var w=$("orbWrap").getBoundingClientRect().width;
    $("orbWrap").style.setProperty("--R",(w/2).toFixed(0)+"px");}
  addEventListener("resize",sizeR);

  sizeR();syncOutputs();apply();
})();
</script>
</body>
</html>
